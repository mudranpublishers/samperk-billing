<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Samperk Billing — GST, stock &amp; accounts</title>
<meta name="theme-color" content="#111827">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="pwa/manifest.webmanifest">
<link rel="icon" href="pwa/icon-192.png">
<link rel="apple-touch-icon" href="pwa/icon-192.png">
<style>
:root{
  --bg:#f4f5f7; --panel:#ffffff; --ink:#1a1d23; --muted:#6b7280; --line:#e3e6eb;
  --accent:#1f5f8b; --accent-soft:#e8f1f7; --ok:#0f7b56; --warn:#b4541a; --bad:#b3261e;
  --radius:10px; --shadow:0 1px 2px rgba(16,24,40,.06),0 1px 3px rgba(16,24,40,.07);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Inter,Helvetica,Arial,sans-serif;
  background:var(--bg); color:var(--ink); font-size:14px; line-height:1.45;
  -webkit-font-smoothing:antialiased;
}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{margin:0;font-weight:650;letter-spacing:-.01em}
a{color:var(--accent)}

/* ---------- shell ---------- */
#app{display:flex;min-height:100vh}
#side{
  width:216px;flex:0 0 216px;background:#111827;color:#cbd5e1;
  display:flex;flex-direction:column;position:sticky;top:0;height:100vh
}
#brand{padding:18px 18px 14px;border-bottom:1px solid #1f2937}
#brand .n{color:#fff;font-weight:700;font-size:15px;letter-spacing:-.01em}
#brand .s{font-size:11px;color:#7e8b9d;margin-top:2px;text-transform:uppercase;letter-spacing:.08em}
nav{padding:10px 8px;flex:1;overflow:auto}
nav button{
  display:flex;align-items:center;gap:9px;width:100%;text-align:left;background:none;border:0;
  color:#cbd5e1;padding:9px 11px;border-radius:8px;cursor:pointer;font-size:13.5px
}
nav button:hover{background:#1c2433;color:#fff}
nav button.on{background:var(--accent);color:#fff;font-weight:600}
nav .grp{font-size:10.5px;text-transform:uppercase;letter-spacing:.09em;color:#64748b;padding:14px 11px 6px}
nav svg{width:16px;height:16px;flex:0 0 16px;stroke:currentColor;fill:none;stroke-width:1.7}
#sidefoot{padding:10px;border-top:1px solid #1f2937;font-size:11px;color:#64748b}

#main{flex:1;min-width:0;display:flex;flex-direction:column}
#top{
  background:var(--panel);border-bottom:1px solid var(--line);padding:11px 20px;
  display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:30
}
#top .co{font-weight:650}
#top .gst{font-size:11.5px;color:var(--muted)}
#top .sp{flex:1}
#page{padding:20px;max-width:1240px;width:100%}

/* ---------- bits ---------- */
.btn{
  background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:7px 13px;
  cursor:pointer;font-size:13px;font-weight:550;box-shadow:var(--shadow);white-space:nowrap
}
.btn:hover{border-color:#c6ccd6;background:#fafbfc}
.btn.pri{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.pri:hover{background:#1a5178}
.btn.sm{padding:4px 9px;font-size:12px;box-shadow:none}
.btn.ghost{background:none;border-color:transparent;box-shadow:none}
.btn.ghost:hover{background:#eceff3}
.btn.danger{color:var(--bad)}
.btn:disabled{opacity:.45;cursor:default}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
.card>h3{padding:13px 16px;border-bottom:1px solid var(--line);font-size:13.5px}
.card>.bd{padding:16px}
.row{display:flex;gap:12px;flex-wrap:wrap}
.grow{flex:1;min-width:0}
.hd{display:flex;align-items:center;gap:10px;margin-bottom:16px}
.hd h2{font-size:19px}
.hd .sub{font-size:12.5px;color:var(--muted)}
label.f{display:block;font-size:11.5px;font-weight:600;color:var(--muted);margin-bottom:4px;text-transform:uppercase;letter-spacing:.04em}
input,select,textarea{
  width:100%;padding:7px 9px;border:1px solid var(--line);border-radius:7px;background:#fff
}
input:focus,select:focus,textarea:focus{outline:2px solid var(--accent-soft);border-color:var(--accent)}
input[readonly]{background:#f7f8fa;color:var(--muted)}
.fld{margin-bottom:12px}
table{width:100%;border-collapse:collapse;font-size:13px}
th{
  text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);
  padding:9px 10px;border-bottom:1px solid var(--line);font-weight:650;white-space:nowrap
}
td{padding:9px 10px;border-bottom:1px solid #f0f2f5;vertical-align:middle}
tbody tr:hover{background:#fafbfc}
.num{text-align:right;font-variant-numeric:tabular-nums}
.mono{font-variant-numeric:tabular-nums}
.tag{display:inline-block;padding:2px 7px;border-radius:999px;font-size:11px;font-weight:600}
.tag.paid{background:#e4f5ec;color:var(--ok)}
.tag.part{background:#fdf0e3;color:var(--warn)}
.tag.due{background:#fdeceb;color:var(--bad)}
.kpi{flex:1;min-width:170px;background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px;box-shadow:var(--shadow)}
.kpi .l{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:650}
.kpi .v{font-size:22px;font-weight:680;margin-top:5px;letter-spacing:-.02em}
.kpi .d{font-size:11.5px;color:var(--muted);margin-top:2px}
.empty{padding:34px 16px;text-align:center;color:var(--muted);font-size:13px}
.hint{font-size:12px;color:var(--muted)}
.sep{height:1px;background:var(--line);margin:16px 0}
.pill{background:var(--accent-soft);color:var(--accent);padding:2px 8px;border-radius:999px;font-size:11.5px;font-weight:600}

/* modal */
#veil{position:fixed;inset:0;background:rgba(17,24,39,.42);display:none;align-items:flex-start;justify-content:center;z-index:60;padding:40px 16px;overflow:auto}
#veil.on{display:flex}
#modal{background:#fff;border-radius:12px;width:100%;max-width:560px;box-shadow:0 20px 50px rgba(0,0,0,.25)}
#modal h3{padding:15px 18px;border-bottom:1px solid var(--line);font-size:15px}
#modal .mb{padding:18px}
#modal .mf{padding:13px 18px;border-top:1px solid var(--line);display:flex;gap:9px;justify-content:flex-end;background:#fafbfc;border-radius:0 0 12px 12px}
#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%) translateY(80px);background:#111827;color:#fff;padding:10px 18px;border-radius:9px;font-size:13px;z-index:90;transition:transform .22s;box-shadow:0 8px 24px rgba(0,0,0,.25)}
#toast.on{transform:translateX(-50%) translateY(0)}

/* billing grid */
table.lines input,table.lines select{padding:5px 7px;border-radius:6px}
table.lines td{padding:5px 6px}
table.lines th{padding:7px 6px}
.totbox{display:flex;justify-content:space-between;padding:5px 0;font-size:13.5px}
.totbox.big{border-top:1px solid var(--line);margin-top:6px;padding-top:9px;font-size:16px;font-weight:700}
.sugg{position:relative}
.sugglist{position:absolute;z-index:40;background:#fff;border:1px solid var(--line);border-radius:8px;box-shadow:0 8px 24px rgba(16,24,40,.14);max-height:220px;overflow:auto;left:0;right:0;top:calc(100% + 2px)}
.sugglist div{padding:7px 10px;cursor:pointer;font-size:13px;display:flex;justify-content:space-between;gap:8px}
.sugglist div:hover,.sugglist div.sel{background:var(--accent-soft)}

/* invoice print */
#printwrap{display:none}
.inv{background:#fff;color:#000;width:190mm;padding:12mm;margin:0 auto;font-size:12px}
.inv .ih{display:flex;justify-content:space-between;border-bottom:2px solid #000;padding-bottom:8px}
.inv .t{text-align:center;font-size:12px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;margin:7px 0}
.inv table{font-size:11.5px}
.inv th,.inv td{border:1px solid #999;padding:4px 6px}
.inv th{background:#f0f0f0;color:#000;text-transform:none;font-size:11px;letter-spacing:0}
.inv .box{border:1px solid #999;padding:6px 8px}
@media print{
  body{background:#fff}
  #app,#veil,#toast{display:none !important}
  #printwrap{display:block !important}
  .inv{width:auto;padding:0}
  @page{size:A4;margin:12mm}
}

/* ---------- v2 additions ---------- */
#side{width:228px;flex:0 0 228px}
nav button small{margin-left:auto;font-size:10px;color:#64748b}
.tabs{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:12px}
.tabs button{background:var(--panel);border:1px solid var(--line);border-radius:7px;padding:5px 11px;font-size:12.5px;cursor:pointer;font-weight:550}
.tabs button.on{background:var(--accent);border-color:var(--accent);color:#fff}
.sub2{display:flex;gap:16px;border-bottom:1px solid var(--line);margin:-4px 0 14px}
.sub2 button{background:none;border:0;border-bottom:2px solid transparent;padding:7px 2px;cursor:pointer;font-size:13px;color:var(--muted);font-weight:550}
.sub2 button.on{color:var(--accent);border-color:var(--accent)}
.chip{display:inline-block;background:#eef1f5;border-radius:5px;padding:1px 6px;font-size:11px;margin-right:3px;font-variant-numeric:tabular-nums}
.chip.exp{background:#fdeceb;color:var(--bad)}
.chip.near{background:#fdf0e3;color:var(--warn)}
.wide{max-width:none}
table.grid td{padding:4px 5px}
table.grid th{padding:6px 5px;font-size:10px}
table.grid input,table.grid select{padding:4px 6px;border-radius:5px;font-size:12.5px}
.scrollx{overflow-x:auto}
.dim{color:var(--muted)}
.right{text-align:right}
.b{font-weight:650}
.gsum{display:grid;grid-template-columns:1fr auto;gap:3px 18px;font-size:13px}
.gsum b{text-align:right;font-variant-numeric:tabular-nums}
.bs{display:flex;gap:14px;flex-wrap:wrap}
.bs>div{flex:1;min-width:280px}
.lbl{border:1px dashed #999;padding:6px;text-align:center;font-size:10px;page-break-inside:avoid}
.lblsheet{display:grid;gap:4px}
.barbox{font-family:"Libre Barcode 39",monospace;letter-spacing:0}
svg.bc{display:block;margin:2px auto}
.warnbar{background:#fdf0e3;border:1px solid #f0d9bd;color:#7a3e0f;padding:8px 12px;border-radius:8px;font-size:12.5px;margin-bottom:12px}
.okbar{background:#e4f5ec;border:1px solid #bfe3d1;color:#0f5c41;padding:8px 12px;border-radius:8px;font-size:12.5px;margin-bottom:12px}
@media print{ .lblprint{display:block !important} }
@media(max-width:860px){
  #side{position:fixed;left:-216px;transition:left .2s;z-index:50}
  #side.open{left:0}
  #page{padding:14px}
  .kpi{min-width:140px}
}
</style>
</head>
<body>
<div id="app">
  <aside id="side">
    <div id="brand"><div class="n">Billing Desk</div><div class="s">GST • Stock • Accounts</div></div>
    <nav id="nav"></nav>
    <div id="sidefoot">Data lives in your file.<br>Press <b>Ctrl+S</b> to save.</div>
  </aside>
  <div id="main">
    <header id="top">
      <button class="btn ghost" id="burger" style="display:none">☰</button>
      <div>
        <div class="co" id="topco">My Business</div>
        <div class="gst" id="topgst">GSTIN not set</div>
      </div>
      <div class="sp"></div>
      <span class="hint" id="dirty"></span>
      <button class="btn" id="btnopen">Open file</button>
      <button class="btn pri" id="btnsave">Save</button>
    </header>
    <div id="page"></div>
  </div>
</div>

<div id="veil"><div id="modal"><h3 id="mtitle"></h3><div class="mb" id="mbody"></div><div class="mf" id="mfoot"></div></div></div>
<div id="toast"></div>
<style id="pagestyle"></style>
<div id="printwrap"></div>
<input type="file" id="filepick" accept=".json,application/json" style="display:none">
<script>
"use strict";
/* =================================================================
   BILLING DESK v2 — core: constants, state, utils, persistence
   ================================================================= */
const STATES=[["37","Andhra Pradesh"],["12","Arunachal Pradesh"],["18","Assam"],["10","Bihar"],["04","Chandigarh"],["22","Chhattisgarh"],["26","Dadra & Nagar Haveli and Daman & Diu"],["07","Delhi"],["30","Goa"],["24","Gujarat"],["06","Haryana"],["02","Himachal Pradesh"],["01","Jammu & Kashmir"],["20","Jharkhand"],["29","Karnataka"],["32","Kerala"],["38","Ladakh"],["31","Lakshadweep"],["23","Madhya Pradesh"],["27","Maharashtra"],["14","Manipur"],["17","Meghalaya"],["15","Mizoram"],["13","Nagaland"],["21","Odisha"],["34","Puducherry"],["03","Punjab"],["08","Rajasthan"],["11","Sikkim"],["33","Tamil Nadu"],["36","Telangana"],["16","Tripura"],["09","Uttar Pradesh"],["05","Uttarakhand"],["19","West Bengal"],["97","Other Territory"]];
const UNITS=["PCS","BOX","STRIP","BTL","KG","GM","LTR","ML","MTR","PKT","NOS","SET","DOZ","TUBE","VIAL","AMP","TIN","JAR","BAG","ROLL"];
const RATES=[0,0.25,3,5,12,18,28];
const PAYMODES=["Cash","UPI","Bank transfer","Cheque","Card","Credit"];

/* ledger groups: [name, side, nature] */
const GROUPS=[
 ["Capital Account","liability","bs"],["Loans (Liability)","liability","bs"],["Current Liabilities","liability","bs"],
 ["Sundry Creditors","liability","bs"],["Duties & Taxes","liability","bs"],
 ["Fixed Assets","asset","bs"],["Investments","asset","bs"],["Current Assets","asset","bs"],
 ["Sundry Debtors","asset","bs"],["Cash-in-Hand","asset","bs"],["Bank Accounts","asset","bs"],["Stock-in-Hand","asset","bs"],
 ["Sales Accounts","income","pl"],["Direct Income","income","pl"],["Indirect Income","income","pl"],
 ["Purchase Accounts","expense","pl"],["Direct Expenses","expense","pl"],["Indirect Expenses","expense","pl"]
];
const GRP=Object.fromEntries(GROUPS.map(g=>[g[0],{side:g[1],nature:g[2]}]));
/* fixed system ledgers */
const SYS=[
 ["cash","Cash in Hand","Cash-in-Hand"],["bank","Bank Account","Bank Accounts"],
 ["sales","Sales","Sales Accounts"],["salesret","Sales Return","Sales Accounts"],
 ["purch","Purchase","Purchase Accounts"],["purchret","Purchase Return","Purchase Accounts"],
 ["ocgst","Output CGST","Duties & Taxes"],["osgst","Output SGST","Duties & Taxes"],["oigst","Output IGST","Duties & Taxes"],
 ["icgst","Input CGST","Duties & Taxes"],["isgst","Input SGST","Duties & Taxes"],["iigst","Input IGST","Duties & Taxes"],
 ["ocess","Output Cess","Duties & Taxes"],["icess","Input Cess","Duties & Taxes"],
 ["round","Round Off","Indirect Expenses"],["discall","Discount Allowed","Indirect Expenses"],["discrec","Discount Received","Indirect Income"],
 ["freight","Freight & Other Charges","Direct Expenses"],["freightin","Other Charges Collected","Direct Income"],
 ["capital","Capital Account","Capital Account"],["stock","Closing Stock","Stock-in-Hand"]
];

function blank(){
  const d={
    meta:{app:"billing-desk",version:2,saved:null},
    company:{name:"My Business",prop:"",gstin:"",state:"27",addr:"",city:"",pin:"",phone:"",email:"",
      dl:"",dl2:"",fssai:"",pan:"",bankName:"",bankAc:"",bankIfsc:"",upi:"",
      terms:"Goods once sold will not be taken back. Interest @18% p.a. on overdue bills.",
      decl:"We declare that this invoice shows the actual price of the goods described and that all particulars are true and correct."},
    settings:{prefix:"INV-",next:1,purPrefix:"PUR-",purNext:1,crPrefix:"CN-",crNext:1,drPrefix:"DN-",drNext:1,vchNext:1,
      roundoff:true,showHsn:true,showBatch:true,pricesIncl:false,rateType:"rate",negStock:true,
      expiryWarnDays:90,labelCols:3,fyStart:"04-01",
      voiceLang:"en-IN",voiceSpeak:true,voiceAutoAdd:true,
      ordPrefix:"ORD-",ordNext:1,fieldPrefix:"SF-",fieldNext:1,fieldMode:false,fieldKind:"order"},
    ledgers:SYS.map(([id,name,group])=>({id,name,group,opening:0,openingType:"dr",system:true})),
    parties:[],items:[],invoices:[],purchases:[],crnotes:[],drnotes:[],vouchers:[],adjust:[],orders:[]
  };
  return d;
}
let db=blank(), fileHandle=null, dirty=false, view="dash", viewArg=null;

/* ---------- utils ---------- */
const $=s=>document.querySelector(s);
const $$=s=>Array.from(document.querySelectorAll(s));
const el=(t,a)=>{const n=document.createElement(t);if(a!=null)n.innerHTML=a;return n};
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const uid=p=>p+Math.random().toString(36).slice(2,9)+(Date.now()%9973).toString(36);
const num=v=>{const x=Number(v);return isFinite(x)?x:0};
const n2=v=>Math.round(num(v)*100)/100;
const n3=v=>Math.round(num(v)*1000)/1000;
const money=v=>n2(v).toLocaleString("en-IN",{minimumFractionDigits:2,maximumFractionDigits:2});
const rup=v=>"₹"+money(v);
const qty=v=>{const x=num(v);return x%1===0?String(x):String(n3(x))};
const today=()=>new Date().toISOString().slice(0,10);
const dmy=d=>{if(!d)return"";const p=String(d).split("-");return p.length===3?p[2]+"/"+p[1]+"/"+p[0]:d};
const my=d=>{if(!d)return"";const p=String(d).split("-");return p[1]+"/"+p[0].slice(2)};
const stName=c=>{const s=STATES.find(x=>x[0]===c);return s?s[1]:""};
const days=(a,b)=>Math.round((new Date(b||today())-new Date(a))/864e5);
const addDays=(d,n)=>new Date(new Date(d).getTime()+n*864e5).toISOString().slice(0,10);
function toast(m){const t=$("#toast");t.textContent=m;t.classList.add("on");clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove("on"),2400)}
function mark(){dirty=true;const d=$("#dirty");if(d)d.textContent="unsaved changes";backup()}
function fyOf(d){const dt=new Date(d||today());const y=dt.getFullYear(),m=dt.getMonth();const s=m>=3?y:y-1;return{label:s+"-"+String((s+1)%100).padStart(2,"0"),from:s+"-04-01",to:(s+1)+"-03-31"}}
function inRange(d,a,b){return (!a||d>=a)&&(!b||d<=b)}
const ONES=["","One","Two","Three","Four","Five","Six","Seven","Eight","Nine","Ten","Eleven","Twelve","Thirteen","Fourteen","Fifteen","Sixteen","Seventeen","Eighteen","Nineteen"];
const TENS=["","","Twenty","Thirty","Forty","Fifty","Sixty","Seventy","Eighty","Ninety"];
const w99=n=>n<20?ONES[n]:TENS[Math.floor(n/10)]+(n%10?" "+ONES[n%10]:"");
const w999=n=>(n>99?ONES[Math.floor(n/100)]+" Hundred"+(n%100?" ":""):"")+(n%100?w99(n%100):"");
function words(amt){
  let n=Math.floor(Math.abs(amt)),p=Math.round((Math.abs(amt)-n)*100),out=[];
  const cr=Math.floor(n/1e7);n%=1e7;const lk=Math.floor(n/1e5);n%=1e5;const th=Math.floor(n/1000);n%=1000;
  if(cr)out.push(w999(cr)+" Crore");if(lk)out.push(w999(lk)+" Lakh");if(th)out.push(w999(th)+" Thousand");if(n)out.push(w999(n));
  let s=out.length?out.join(" "):"Zero";
  if(p)s+=" and "+w99(p)+" Paise";
  return "Rupees "+s+" Only";
}
/* print bridge: Android WebView (APK) has no window.print(), so a tiny
   Java interface is used when present; browsers use window.print(). */
function doPrint(){
  try{
    if(window.AndroidPrint&&typeof window.AndroidPrint.print==="function"){window.AndroidPrint.print();return}
  }catch(e){}
  window.print();
}
function gstinOk(g){return !g||/^[0-9]{2}[A-Z]{5}[0-9]{4}[A-Z][0-9A-Z][Z][0-9A-Z]$/.test(g.toUpperCase())}

/* ---------- persistence ---------- */
const LS="billing-desk-backup";
function backup(){try{localStorage.setItem(LS,JSON.stringify(db))}catch(e){}}
function loadBackup(){try{const r=localStorage.getItem(LS);if(r){const d=JSON.parse(r);if(d&&d.meta&&d.meta.app==="billing-desk")return d}}catch(e){}return null}
function migrate(d){
  if(!d.meta)return null;
  if((d.meta.version||1)>=2)return d;
  /* v1 -> v2 */
  const b=blank();
  b.company=Object.assign(b.company,d.company||{});
  if(d.company&&d.company.bank)b.company.bankName=d.company.bank;
  b.settings=Object.assign(b.settings,{prefix:(d.settings||{}).prefix||"INV-",next:(d.settings||{}).next||1,
    roundoff:(d.settings||{}).roundoff!==false,showHsn:(d.settings||{}).showHsn!==false,pricesIncl:!!(d.settings||{}).pricesIncl});
  b.parties=(d.parties||[]).map(p=>Object.assign({type:"customer",credit:0,limit:0,opening:0,openingType:"dr"},p));
  b.items=(d.items||[]).map(i=>Object.assign({mrp:num(i.rate),wrate:num(i.rate),pack:"",company:"",rack:"",cess:0},i));
  b.invoices=(d.invoices||[]).map(iv=>Object.assign({charges:[],mode:"Credit"},iv));
  b.adjust=(d.purchases||[]).map(p=>({id:p.id,date:p.date,note:p.note,lines:p.lines.map(l=>({item:l.item,batch:"",exp:"",qty:l.qty,rate:0}))}));
  /* opening stock -> opening adjustment */
  const op=(d.items||[]).filter(i=>num(i.opening)).map(i=>({item:i.id,batch:"",exp:"",qty:num(i.opening),rate:num(i.cost)}));
  if(op.length)b.adjust.unshift({id:uid("ad"),date:fyOf(today()).from,note:"Opening stock",lines:op});
  b.vouchers=(d.payments||[]).map(p=>({id:p.id,type:"receipt",no:"",date:p.date,party:(d.invoices.find(i=>i.id===p.invoice)||{}).party||"",

/* ---------- line & document maths ---------- */
function calcLine(l,inter){
  const q=num(l.qty),r=num(l.rate),d=num(l.disc),g=num(l.gst),cs=num(l.cess);
  let gross=q*r, discAmt=gross*d/100, taxable=gross-discAmt;
  if(db.settings.pricesIncl)taxable=taxable/(1+(g+cs)/100);
  taxable=n2(taxable);
  const tax=n2(taxable*g/100), cess=n2(taxable*cs/100);
  return{gross:n2(gross),disc:n2(discAmt),taxable,
    cgst:inter?0:n2(tax/2),sgst:inter?0:n2(tax-n2(tax/2)),igst:inter?tax:0,cess,tax,
    total:n2(taxable+tax+cess)};
}
function calcDoc(doc){
  const inter=isInter(doc.party);
  const t={taxable:0,disc:0,cgst:0,sgst:0,igst:0,cess:0,tax:0,sum:0,qty:0,free:0};
  (doc.lines||[]).forEach(l=>{const c=calcLine(l,inter);l._c=c;
    t.taxable+=c.taxable;t.disc+=c.disc;t.cgst+=c.cgst;t.sgst+=c.sgst;t.igst+=c.igst;t.cess+=c.cess;t.tax+=c.tax;t.sum+=c.total;
    t.qty+=num(l.qty);t.free+=num(l.free)});
  for(const k in t)t[k]=n2(t[k]);
  const charges=(doc.charges||[]).reduce((s,c)=>s+num(c.amount),0);
  const gross=n2(t.sum+charges-num(doc.billDisc));
  const grand=db.settings.roundoff?Math.round(gross):gross;
  doc.totals=Object.assign(t,{inter,charges:n2(charges),billDisc:n2(num(doc.billDisc)),
    round:n2(grand-gross),grand:n2(grand)});
  return doc.totals;
}

function docStatus(doc,cash){
  if(doc.mode==="Cash")return{k:"paid",t:"Cash",due:0};
  const p=paidOn(doc.id),g=doc.totals.grand;
  if(p>=g-0.49)return{k:"paid",t:"Settled",due:0};
  if(p>0)return{k:"part",t:"Part "+money(g-p),due:n2(g-p)};
  return{k:"due",t:"Pending",due:n2(g)};
}
function partyBalance(pid){
  /* positive = they owe us (debit) */
  const p=party(pid);if(!p)return 0;
  let b=(p.openingType==="cr"?-1:1)*num(p.opening);
  db.invoices.forEach(d=>{if(d.party===pid&&d.mode!=="Cash")b+=d.totals.grand});
  db.crnotes.forEach(d=>{if(d.party===pid&&d.mode!=="Cash")b-=d.totals.grand});
  db.purchases.forEach(d=>{if(d.party===pid&&d.mode!=="Cash")b-=d.totals.grand});
  db.drnotes.forEach(d=>{if(d.party===pid&&d.mode!=="Cash")b+=d.totals.grand});
  db.vouchers.forEach(v=>{if(v.party!==pid)return;
    if(v.type==="receipt")b-=num(v.amount);
    else if(v.type==="payment")b+=num(v.amount);
    else (v.entries||[]).forEach(e=>{if(e.ledger==="p:"+pid)b+=num(e.dr)-num(e.cr)});

function batchStock(itemId,upto){

function ledgerBalance(id,upto){
  const l=led(id);if(!l)return 0;
  let b=(l.openingType==="cr"?-1:1)*num(l.opening);
  ps().forEach(p=>{if(p.ledger===id&&(!upto||p.date<=upto))b+=p.dr-p.cr});

function trialBalance(from,to){
  const rows=[];
  allLedgers().forEach(l=>{
    const op=(l.openingType==="cr"?-1:1)*num(l.opening);
    let pdr=0,pcr=0,pre=0;
    ps().forEach(p=>{if(p.ledger!==l.id)return;
      if(from&&p.date<from){pre+=p.dr-p.cr;return}
      if(to&&p.date>to)return;
      pdr+=p.dr;pcr+=p.cr});
    const opening=n2(op+pre), closing=n2(opening+pdr-pcr);
    if(!opening&&!pdr&&!pcr&&!closing)return;
    rows.push({id:l.id,name:l.name,group:l.group,opening,dr:n2(pdr),cr:n2(pcr),closing});
  });
  return rows.sort((a,b)=>a.group.localeCompare(b.group)||a.name.localeCompare(b.name));
}
function groupTotal(rows,groups){return n2(rows.filter(r=>groups.includes(r.group)).reduce((s,r)=>s+r.closing,0))}
function profitLoss(from,to){
  const rows=trialBalance(from,to);
  const pick=id=>{const r=rows.find(x=>x.id===id);return r?r.closing:0};
  const sales=-pick("sales"), sret=pick("salesret");
  const purch=pick("purch"), pret=-pick("purchret");
  const openStock=stockValue(from?addDays(from,-1):null), closeStock=stockValue(to);
  const direct=n2(rows.filter(r=>r.group==="Direct Expenses").reduce((s,r)=>s+r.closing,0));
  const dinc=n2(-rows.filter(r=>r.group==="Direct Income").reduce((s,r)=>s+r.closing,0));
  const gross=n2((sales-sret+closeStock+dinc)-(openStock+purch-pret+direct));
  const indExp=n2(rows.filter(r=>r.group==="Indirect Expenses").reduce((s,r)=>s+r.closing,0));
  const indInc=n2(-rows.filter(r=>r.group==="Indirect Income").reduce((s,r)=>s+r.closing,0));
  return{sales:n2(sales),sret:n2(sret),purch:n2(purch),pret:n2(pret),openStock,closeStock,direct,dinc,gross,indExp,indInc,
    net:n2(gross+indInc-indExp),rows};
}
function balanceSheet(to){
  const fy=fyOf(to||today());
  const rows=trialBalance(null,to);
  const pl=profitLoss(fy.from,to||today());
  const assetGroups=["Fixed Assets","Investments","Current Assets","Sundry Debtors","Cash-in-Hand","Bank Accounts"];
  const liabGroups=["Capital Account","Loans (Liability)","Current Liabilities","Sundry Creditors","Duties & Taxes"];
  const assets=[],liab=[];
  assetGroups.forEach(g=>rows.filter(r=>r.group===g&&r.closing).forEach(r=>{
    if(r.closing>=0)assets.push({name:r.name,group:g,amt:r.closing});else liab.push({name:r.name,group:g,amt:-r.closing})}));
  liabGroups.forEach(g=>rows.filter(r=>r.group===g&&r.closing).forEach(r=>{
    if(r.closing<=0)liab.push({name:r.name,group:g,amt:-r.closing});else assets.push({name:r.name,group:g,amt:r.closing})}));
  assets.push({name:"Closing Stock",group:"Stock-in-Hand",amt:pl.closeStock});
  liab.push({name:pl.net>=0?"Profit for the period":"Loss for the period",group:"Capital Account",amt:pl.net});
  const ta=n2(assets.reduce((s,x)=>s+x.amt,0)), tl=n2(liab.reduce((s,x)=>s+x.amt,0));
  return{assets,liab,ta,tl,diff:n2(ta-tl),pl};
}

function fieldsHtml(fs,obj){
  return fs.map(f=>{
    const v=obj&&obj[f.k]!=null?obj[f.k]:(f.def!=null?f.def:"");
    let inp;
    if(f.t==="select")inp='<select data-k="'+f.k+'">'+f.o.map(o=>{const[val,lab]=Array.isArray(o)?o:[o,o];
        return '<option value="'+esc(val)+'"'+(String(val)===String(v)?" selected":"")+'>'+esc(lab)+'</option>'}).join("")+'</select>';
    else if(f.t==="textarea")inp='<textarea data-k="'+f.k+'" rows="'+(f.rows||2)+'">'+esc(v)+'</textarea>';
    else if(f.t==="check")inp='<label style="display:flex;gap:7px;align-items:center;font-size:13px;padding-top:4px"><input type="checkbox" data-k="'+f.k+'" style="width:auto"'+(v?" checked":"")+'> '+esc(f.note||"")+'</label>';
    else inp='<input data-k="'+f.k+'" type="'+(f.t||"text")+'" value="'+esc(v)+'"'+(f.t==="number"?' step="any"':"")+(f.ph?' placeholder="'+esc(f.ph)+'"':"")+'>';
    return '<div class="fld" style="flex:'+(f.w||"1 1 160px")+'"><label class="f">'+f.l+'</label>'+inp+'</div>';
  }).join("");
}
function readFields(scope){
  const o={};scope.querySelectorAll("[data-k]").forEach(n=>{
    o[n.dataset.k]=n.type==="checkbox"?n.checked:(n.type==="number"?(n.value===""?"":Number(n.value)):(n.value||"").trim())});

function tbl(head,rows,cls){

function attachSuggest(inp,getList,onPick){
  const wrap=inp.parentElement;let box=null,idx=-1,cur=[];
  const close=()=>{if(box){box.remove();box=null}idx=-1};
  const show=()=>{
    const q=(inp.value||"").toLowerCase().trim();
    cur=getList(q).slice(0,50);close();if(!cur.length)return;
    box=el("div");box.className="sugglist";
    cur.forEach((o,i)=>{const d=el("div",'<span>'+esc(o.label)+'</span><span class="hint">'+(o.right||"")+'</span>');
      d.onmousedown=e=>{e.preventDefault();pick(i)};box.appendChild(d)});
    wrap.appendChild(box);
  };
  const pick=i=>{const o=cur[i];close();if(o)onPick(o)};
  inp.addEventListener("input",show);inp.addEventListener("focus",show);
  inp.addEventListener("blur",()=>setTimeout(close,130));
  inp.addEventListener("keydown",e=>{
    if(!box)return;const ds=box.querySelectorAll("div");
    if(e.key==="ArrowDown"||e.key==="ArrowUp"){e.preventDefault();idx=(idx+(e.key==="ArrowDown"?1:-1)+cur.length)%cur.length;
      ds.forEach((d,i)=>d.classList.toggle("sel",i===idx));ds[idx].scrollIntoView({block:"nearest"})}
    else if(e.key==="Enter"){if(idx>=0){e.preventDefault();pick(idx)}else if(cur.length===1){e.preventDefault();pick(0)}}
    else if(e.key==="Escape")close();
  });
  inp._closeSugg=close;
}

  function saleRate(it){const p=party(doc.party);const f=(p&&p.rateType)||db.settings.rateType||"rate";
    return out&&t==="sale"?num(it[f]||it.rate):(t==="purchase"||t==="dr"?(costOf(it.id)||num(it.cost)):num(it.rate))}
  function pickItem(l,it,keepName){
    l.item=it.id;if(!keepName)l.name=it.name;
    l.hsn=it.hsn||"";l.unit=it.unit||"PCS";l.gst=num(it.gst);l.cess=num(it.cess);
    l.rate=saleRate(it);l.mrp=num(it.mrp)||"";
    if(out){const bs=batchStock(it.id).filter(b=>b.qty>0);if(bs.length){l.batch=bs[0].batch;l.exp=bs[0].exp;l.mrp=bs[0].mrp||l.mrp}}
  }
  function charges(){
    const c=$("#e-charges");c.innerHTML="";

      const r=el("div");r.className="row";r.style.gap="6px";r.style.marginBottom="6px";
      r.innerHTML='<input style="flex:2" value="'+esc(ch.name)+'" data-c="name"><input style="flex:1" class="num" type="number" step="any" value="'+esc(ch.amount)+'" data-c="amount"><button class="btn ghost sm" data-crm>✕</button>';
      r.querySelectorAll("[data-c]").forEach(n=>n.oninput=()=>{ch[n.dataset.c]=n.dataset.c==="amount"?Number(n.value||0):n.value;totals()});
      r.querySelector("[data-crm]").onclick=()=>{doc.charges.splice(i,1);charges();totals()};
      c.appendChild(r);
    });
  }
  function totals(){
    const T=calcDoc(doc);
    let warn="";
    if(out)doc.lines.forEach(l=>{if(!l.item)return;
      const have=db.settings.showBatch?(batchStock(l.item).find(b=>(b.batch||"")===(l.batch||""))||{qty:0}).qty:stockOf(l.item);
      const want=num(l.qty)+num(l.free);
      const orig=doc.id?(db[D.coll].find(x=>x.id===doc.id)||{lines:[]}).lines.filter(x=>x.item===l.item&&(x.batch||"")===(l.batch||"")).reduce((s,x)=>s+num(x.qty)+num(x.free),0):0;
      if(want>have+orig)warn+='<div style="color:var(--bad);font-size:12px">⚠ '+esc(l.name)+(l.batch?" ["+esc(l.batch)+"]":"")+": only "+qty(have+orig)+" available</div>";
    });

    $("#e-tot").innerHTML=
      '<div class="totbox"><span>Gross</span><b class="mono">'+money(T.taxable+T.disc)+'</b></div>'+
      (T.disc?'<div class="totbox"><span>Item discount</span><b class="mono">-'+money(T.disc)+'</b></div>':'')+
      '<div class="totbox"><span>Taxable value</span><b class="mono">'+money(T.taxable)+'</b></div>'+
      (T.inter?'<div class="totbox"><span>IGST</span><b class="mono">'+money(T.igst)+'</b></div>'
        :'<div class="totbox"><span>CGST</span><b class="mono">'+money(T.cgst)+'</b></div><div class="totbox"><span>SGST</span><b class="mono">'+money(T.sgst)+'</b></div>')+
      (T.cess?'<div class="totbox"><span>Cess</span><b class="mono">'+money(T.cess)+'</b></div>':'')+
      (T.charges?'<div class="totbox"><span>Other charges</span><b class="mono">'+money(T.charges)+'</b></div>':'')+
      '<div class="totbox"><span>Bill discount</span><input id="e-bd" class="num" type="number" step="any" style="width:96px" value="'+esc(doc.billDisc)+'"></div>'+
      (T.round?'<div class="totbox"><span>Round off</span><b class="mono">'+money(T.round)+'</b></div>':'')+
      '<div class="totbox big"><span>'+(doc.mode==="Cash"?"Cash total":"Net payable")+'</span><span class="mono">'+rup(T.grand)+'</span></div>'+
      '<div class="hint" style="margin-top:6px">'+esc(words(T.grand))+'</div>'+warn;
    const bd=$("#e-bd");bd.oninput=()=>{doc.billDisc=bd.value===""?"":Number(bd.value);const v=bd.value;totals();
      const n=$("#e-bd");n.value=v;n.focus()};
  }
  function save(print){
    if(!doc.partyName.trim())return toast("Enter a "+D.pt+" name");
    const good=doc.lines.filter(l=>String(l.name).trim()&&num(l.qty)>0);
    if(!good.length)return toast("Add at least one item with a quantity");
    if(db[D.coll].some(x=>x.no===doc.no&&x.id!==doc.id))return toast(D.short+" no. "+doc.no+" already exists");
    if(!doc.party){
      const pt={id:uid("p"),name:doc.partyName.trim(),type:D.pt,gstin:"",state:db.company.state,addr:"",city:"",pin:"",
        phone:"",email:"",credit:0,limit:0,opening:0,openingType:"dr"};
      db.parties.push(pt);doc.party=pt.id;
    }
    if(D.dir==="in"){ /* create / refresh item master rates from purchase */
      good.forEach(l=>{if(!l.item){const it={id:uid("it"),name:String(l.name).trim(),code:"",hsn:l.hsn||"",unit:l.unit,pack:"",company:"",rack:"",
          gst:num(l.gst),cess:num(l.cess),mrp:num(l.mrp),rate:n2(num(l.mrp)||num(l.rate)*1.2),wrate:n2(num(l.rate)*1.1),cost:num(l.rate),reorder:0};
        db.items.push(it);l.item=it.id}
        else{const it=item(l.item);if(it){it.cost=num(l.rate);if(num(l.mrp))it.mrp=num(l.mrp)}}});
    }
    doc.lines=good.map(l=>({item:l.item,name:String(l.name).trim(),hsn:l.hsn,batch:l.batch||"",exp:l.exp||"",
      mrp:num(l.mrp),unit:l.unit,qty:num(l.qty),free:num(l.free),rate:num(l.rate),disc:num(l.disc),gst:num(l.gst),cess:num(l.cess)}));
    doc.charges=(doc.charges||[]).filter(c=>num(c.amount));
    calcDoc(doc);
    const rec=JSON.parse(JSON.stringify(doc));delete rec._inter;
    if(rec.id)db[D.coll]=db[D.coll].map(x=>x.id===rec.id?rec:x);
    else{rec.id=uid("d");db[D.coll].push(rec);
      const m=/(\d+)\s*$/.exec(rec.no);db.settings[D.nxt]=m?Number(m[1])+1:db.settings[D.nxt]+1}
    touch();toast(D.short+" "+rec.no+" saved");
    const id=rec.id;doc=null;
    if(print)printDoc(id,t);
    go(D.view);
  }
}

/* A pharma wholesaler's invoice legally carries the drug licence numbers;
   a GST invoice carries the full address. Say what is still missing rather
   than printing bills that are quietly non-compliant. */
function setupGaps(){
  const c=db.company,miss=[];
  if(!c.gstin)miss.push("GSTIN");
  if(!c.addr)miss.push("shop address");
  if(!c.pin)miss.push("PIN code");
  if(!c.phone)miss.push("phone");
  if(!c.dl&&!c.dl2)miss.push("drug licence numbers (20B / 21B)");
  if(!c.bankName&&!c.upi)miss.push("bank or UPI details");
  if(!miss.length)return "";
  return '<div class="warnbar" style="display:flex;align-items:center;gap:12px">'+
    '<div class="grow">Bills are printing without: <b>'+esc(miss.join(", "))+'</b>. '+
    (miss.some(m=>m.indexOf("licence")>=0)?"Drug licence numbers are required on a chemist's invoice. ":'')+
    'Add them once and every bill carries them.</div>'+
    '<button class="btn" id="dash-setup">Open Setup</button></div>';
}

const regF={invoices:{q:"",from:"",to:"",status:""},purchases:{q:"",from:"",to:"",status:""},notes:{q:"",from:"",to:"",status:""}};
let noteTab="cr";
function register(p,coll,t,title){
  const D=DT[t],F=regF[coll==="crnotes"||coll==="drnotes"?"notes":coll];
  const all=db[coll].filter(d=>{
    const pt=party(d.party);
    if(!inRange(d.date,F.from,F.to))return false;
    if(F.q){const s=(d.no+" "+(pt?pt.name:"")+" "+(d.refNo||"")+" "+d.lines.map(l=>l.name).join(" ")).toLowerCase();

function splitCsvLine(l){
  const out=[];let cur="",q=false;
  for(let i=0;i<l.length;i++){const c=l[i];
    if(q){if(c==='"'){if(l[i+1]==='"'){cur+='"';i++}else q=false}else cur+=c}
    else if(c==='"')q=true;else if(c===","||c==="\t"){out.push(cur);cur=""}else cur+=c}
  out.push(cur);return out.map(s=>s.trim());
}
function parseItemCsv(txt){
  const lines=txt.split(/\r?\n/).filter(l=>l.trim());
  if(lines.length<2)return{ok:false,msg:"Need a header row and at least one item"};
  const head=splitCsvLine(lines[0]).map(h=>h.toLowerCase().replace(/[^a-z]/g,""));
  const ix=k=>head.indexOf(k);
  if(ix("name")<0)return{ok:false,msg:'A "name" column is required'};
  let added=0,updated=0;
  lines.slice(1).forEach(l=>{
    const c=splitCsvLine(l);const g=k=>{const i=ix(k);return i>=0?c[i]:""};
    const name=g("name");if(!name)return;
    let it=db.items.find(x=>x.name.toLowerCase()===name.toLowerCase());
    const o={name,composition:g("composition")||g("salt"),company:g("company")||g("brand"),pack:g("pack"),
      form:g("form")||"tablet",code:g("code"),hsn:g("hsn"),unit:(g("unit")||"STRIP").toUpperCase(),
      gst:num(g("gst"))||12,mrp:num(g("mrp")),rate:num(g("rate")),wrate:num(g("wrate")),cost:num(g("cost")),
      rack:g("rack"),reorder:num(g("reorder")),rx:/^(1|y|yes|true|rx)$/i.test(g("rx"))};
    if(!o.rate&&o.mrp)o.rate=n2(o.mrp/(1+o.gst/100)/1.2);
    if(!o.cost&&o.rate)o.cost=n2(o.rate/1.1);
    if(!o.wrate)o.wrate=o.rate;
    if(it){Object.keys(o).forEach(k=>{if(o[k]!==""&&o[k]!=null&&!(typeof o[k]==="number"&&!o[k]))it[k]=o[k]});updated++}
    else{o.id=uid("it");db.items.push(o);added++;it=o}
    const open=num(g("opening"));
    if(open)db.adjust.push({id:uid("ad"),date:today(),note:"Imported opening stock",
      lines:[{item:it.id,batch:g("batch"),exp:g("expiry"),mrp:o.mrp,qty:open,rate:o.cost}]});
  });
  return{ok:true,added,updated};
}

        [["Today","t"],["Yesterday","y"],["This month","m"],["This FY","f"]].map(([l,k])=>'<button class="btn sm" data-q="'+k+'">'+l+'</button>').join("")+
      '</div></div>'+
    '</div></div></div>'+

      kpi("Cash received",rup(cashIn),"in the period")+kpi("Cash paid",rup(cashOut),"in the period")+

    tbl(["Date","Voucher","No.","Ledger","Debit","Credit"],P.map(x=>[dmy(x.date),x.type,esc(x.no||""),esc(ledName(x.ledger)),{n:x.dr?money(x.dr):""},{n:x.cr?money(x.cr):""}])));

function periodBar(F,onChange,extra){
  return '<div class="card" style="margin-bottom:12px"><div class="bd"><div class="row" style="align-items:flex-end">'+
    '<div class="fld" style="flex:0 0 150px"><label class="f">From</label><input id="pb-from" type="date" value="'+F.from+'"></div>'+
    '<div class="fld" style="flex:0 0 150px"><label class="f">To</label><input id="pb-to" type="date" value="'+F.to+'"></div>'+
    '<div class="fld" style="flex:1"><label class="f">Quick</label><div class="row" style="gap:6px">'+
      [["This month","m"],["Last month","lm"],["This quarter","q"],["This FY","fy"],["All","all"]].map(([l,k])=>'<button class="btn sm" data-q="'+k+'">'+l+'</button>').join("")+
    '</div></div>'+(extra||'')+'</div></div></div>';
}
function wirePeriod(p,F){
  const r=()=>render();
  $("#pb-from").onchange=e=>{F.from=e.target.value;r()};
  $("#pb-to").onchange=e=>{F.to=e.target.value;r()};
  p.querySelectorAll("[data-q]").forEach(b=>b.onclick=()=>{
    const d=new Date(),k=b.dataset.q,pz=n=>String(n).padStart(2,"0");
    if(k==="m"){F.from=d.getFullYear()+"-"+pz(d.getMonth()+1)+"-01";F.to=today()}
    if(k==="lm"){const a=new Date(d.getFullYear(),d.getMonth()-1,1),b2=new Date(d.getFullYear(),d.getMonth(),0);
      F.from=a.getFullYear()+"-"+pz(a.getMonth()+1)+"-01";F.to=b2.getFullYear()+"-"+pz(b2.getMonth()+1)+"-"+pz(b2.getDate())}
    if(k==="q"){const qm=Math.floor(d.getMonth()/3)*3;F.from=d.getFullYear()+"-"+pz(qm+1)+"-01";F.to=today()}
    if(k==="fy"){const f=fyOf(today());F.from=f.from;F.to=today()}
    if(k==="all"){F.from="2000-01-01";F.to="2099-12-31"}
    r()});
}

let gstF={from:"",to:"",tab:"summary"};
VIEWS.gst=function(p){

  const out=sumTax(inv), outCn=sumTax(cn), itc=sumTax(pur), itcDn=sumTax(dn);
  const net={cgst:n2(out.cgst-outCn.cgst-(itc.cgst-itcDn.cgst)),sgst:n2(out.sgst-outCn.sgst-(itc.sgst-itcDn.sgst)),
    igst:n2(out.igst-outCn.igst-(itc.igst-itcDn.igst)),cess:n2(out.cess-outCn.cess-(itc.cess-itcDn.cess))};

    periodBar(gstF)+
    '<div class="row" style="margin-bottom:12px">'+
      kpi("Output tax",rup(out.cgst+out.sgst+out.igst+out.cess),"on "+money(out.taxable)+" taxable")+
      kpi("Input credit",rup(itc.cgst+itc.sgst+itc.igst+itc.cess),"on "+money(itc.taxable)+" purchases")+
      kpi("Credit notes",rup(outCn.cgst+outCn.sgst+outCn.igst),cn.length+" issued")+
      kpi("Net payable",rup(payable),"cash liability",payable>0?"var(--bad)":"var(--ok)")+
    '</div>'+
    '<div class="tabs" id="g-tabs">'+[["summary","GSTR-3B summary"],["b2b","GSTR-1 B2B"],["b2cs","B2C"],["cdnr","Credit / debit notes"],["hsn","HSN summary"],["itc","Purchase / ITC register"],["docs","Documents issued"]]
      .map(([k,l])=>'<button class="'+(gstF.tab===k?"on":"")+'" data-t="'+k+'">'+l+'</button>').join("")+'</div>'+
    '<div class="card" id="g-body"></div>';
  wirePeriod(p,gstF);
  p.querySelectorAll("#g-tabs [data-t]").forEach(b=>b.onclick=()=>{gstF.tab=b.dataset.t;render()});
  const R=gstReport(gstF.tab,{inv,pur,cn,dn,out,outCn,itc,itcDn,net,payable});
  $("#g-body").innerHTML='<h3>'+R.title+'</h3>'+(R.rows.length?tbl(R.head,R.rows):'<div class="empty">Nothing in this period.</div>')+
    (R.foot?'<div class="bd" style="border-top:1px solid var(--line)">'+R.foot+'</div>':'');
  $("#g-csv").onclick=()=>exportCsv("gst-"+gstF.tab+".csv",[R.head].concat(R.rows.map(r=>r.map(c=>c&&c.n!=null?String(c.n).replace(/<[^>]*>/g,""):String(c==null?"":c).replace(/<[^>]*>/g,"")))));
  $("#g-print").onclick=()=>printHtml('<h3 style="margin:0">'+esc(db.company.name)+' — '+R.title+'</h3>'+
    '<div>GSTIN '+esc(db.company.gstin||"—")+' · '+dmy(gstF.from)+" to "+dmy(gstF.to)+'</div><br>'+tbl(R.head,R.rows)+(R.foot||""));
  $("#g-json").onclick=()=>gstr1Json();
};
function sumTax(docs){
  const t={taxable:0,cgst:0,sgst:0,igst:0,cess:0};
  docs.forEach(d=>{calcDoc(d);t.taxable+=d.totals.taxable;t.cgst+=d.totals.cgst;t.sgst+=d.totals.sgst;t.igst+=d.totals.igst;t.cess+=d.totals.cess});
  for(const k in t)t[k]=n2(t[k]);return t;
}
function rateSplit(docs){
  const m={};
  docs.forEach(d=>d.lines.forEach(l=>{const x=calcLine(l,d.totals.inter),k=num(l.gst);
    m[k]=m[k]||{rate:k,taxable:0,cgst:0,sgst:0,igst:0,cess:0};
    const v=m[k];v.taxable+=x.taxable;v.cgst+=x.cgst;v.sgst+=x.sgst;v.igst+=x.igst;v.cess+=x.cess}));
  return Object.values(m).sort((a,b)=>a.rate-b.rate);
}
function gstReport(tab,D){
  if(tab==="summary"){
    const rows=[
      ["3.1(a) Outward taxable supplies",{n:money(D.out.taxable)},{n:money(D.out.igst)},{n:money(D.out.cgst)},{n:money(D.out.sgst)},{n:money(D.out.cess)}],
      ["Less: credit notes",{n:money(D.outCn.taxable)},{n:money(D.outCn.igst)},{n:money(D.outCn.cgst)},{n:money(D.outCn.sgst)},{n:money(D.outCn.cess)}],
      ["Net outward",{n:money(D.out.taxable-D.outCn.taxable)},{n:money(D.out.igst-D.outCn.igst)},{n:money(D.out.cgst-D.outCn.cgst)},{n:money(D.out.sgst-D.outCn.sgst)},{n:money(D.out.cess-D.outCn.cess)}],
      ["4(A)(5) ITC — all other",{n:money(D.itc.taxable)},{n:money(D.itc.igst)},{n:money(D.itc.cgst)},{n:money(D.itc.sgst)},{n:money(D.itc.cess)}],
      ["Less: debit notes to suppliers",{n:money(D.itcDn.taxable)},{n:money(D.itcDn.igst)},{n:money(D.itcDn.cgst)},{n:money(D.itcDn.sgst)},{n:money(D.itcDn.cess)}],
      ["<b>Net tax payable</b>","",{n:'<b>'+money(D.net.igst)+'</b>'},{n:'<b>'+money(D.net.cgst)+'</b>'},{n:'<b>'+money(D.net.sgst)+'</b>'},{n:'<b>'+money(D.net.cess)+'</b>'}]];
    return{title:"GSTR-3B style summary",head:["Particulars","Taxable value","IGST","CGST","SGST","Cess"],rows,
      foot:'<div class="gsum" style="max-width:380px;margin-left:auto"><span>Total payable in cash</span><b>'+rup(D.payable)+'</b></div>'};
  }
  if(tab==="b2b"){
    const list=D.inv.filter(d=>{const pt=party(d.party);return pt&&pt.gstin});
    const rows=list.map(d=>{const pt=party(d.party);
      return [esc(pt.gstin),esc(pt.name),esc(d.no),dmy(d.date),{n:money(d.totals.grand)},esc(stName(pt.state)),
        d.totals.inter?"Inter":"Intra",{n:money(d.totals.taxable)},{n:money(d.totals.igst)},{n:money(d.totals.cgst)},{n:money(d.totals.sgst)},{n:money(d.totals.cess)}]});
    const t=sumTax(list);
    return{title:"GSTR-1 · B2B invoices (registered customers)",
      head:["GSTIN","Customer","Invoice","Date","Invoice value","Place of supply","Type","Taxable","IGST","CGST","SGST","Cess"],rows,
      foot:'<div class="gsum" style="max-width:420px;margin-left:auto"><span>Taxable</span><b>'+money(t.taxable)+'</b><span>Total tax</span><b>'+money(t.cgst+t.sgst+t.igst+t.cess)+'</b></div>'};
  }
  if(tab==="b2cs"){
    const list=D.inv.filter(d=>{const pt=party(d.party);return !pt||!pt.gstin});
    const m={};
    list.forEach(d=>{const pt=party(d.party)||{};d.lines.forEach(l=>{
      const k=(pt.state||db.company.state)+"|"+num(l.gst);const x=calcLine(l,d.totals.inter);
      m[k]=m[k]||{state:pt.state||db.company.state,rate:num(l.gst),taxable:0,cgst:0,sgst:0,igst:0,cess:0};
      const v=m[k];v.taxable+=x.taxable;v.cgst+=x.cgst;v.sgst+=x.sgst;v.igst+=x.igst;v.cess+=x.cess})});

      .map(v=>[esc(stName(v.state)),v.state,{n:v.rate+"%"},{n:money(v.taxable)},{n:money(v.igst)},{n:money(v.cgst)},{n:money(v.sgst)},{n:money(v.cess)}]);
    return{title:"GSTR-1 · B2C supplies (unregistered)",head:["Place of supply","Code","Rate","Taxable","IGST","CGST","SGST","Cess"],rows,
      foot:'<div class="hint">'+list.length+' invoices to unregistered buyers in this period.</div>'};

    return{title:"GSTR-1 · credit and debit notes",head:["No.","Date","Type","Party","GSTIN","Against","Taxable","IGST","CGST","SGST","Note value"],rows};
  }
  if(tab==="hsn"){
    const m={};
    D.inv.forEach(d=>d.lines.forEach(l=>{const x=calcLine(l,d.totals.inter);const it=item(l.item)||{};
      const k=(l.hsn||it.hsn||"—")+"|"+num(l.gst);
      m[k]=m[k]||{hsn:l.hsn||it.hsn||"—",rate:num(l.gst),desc:l.name,uqc:l.unit,qty:0,taxable:0,cgst:0,sgst:0,igst:0,cess:0};
      const v=m[k];v.qty+=num(l.qty)+num(l.free);v.taxable+=x.taxable;v.cgst+=x.cgst;v.sgst+=x.sgst;v.igst+=x.igst;v.cess+=x.cess}));

    const t=D.itc;

  }
  const kinds=[["invoices","Tax invoice"],["crnotes","Credit note"],["drnotes","Debit note"]];

}
function gstr1Json(){
  const inv=db.invoices.filter(d=>inRange(d.date,gstF.from,gstF.to));
  const fp=(gstF.from.slice(5,7))+gstF.from.slice(0,4);
  const b2b={};
  inv.forEach(d=>{const pt=party(d.party);if(!pt||!pt.gstin)return;
    const itms=[];const m={};
    d.lines.forEach(l=>{const x=calcLine(l,d.totals.inter);const k=num(l.gst);
      m[k]=m[k]||{rt:k,txval:0,iamt:0,camt:0,samt:0,csamt:0};
      m[k].txval+=x.taxable;m[k].iamt+=x.igst;m[k].camt+=x.cgst;m[k].samt+=x.sgst;m[k].csamt+=x.cess});
    Object.values(m).forEach((v,i)=>itms.push({num:i+1,itm_det:{rt:v.rt,txval:n2(v.txval),iamt:n2(v.iamt),camt:n2(v.camt),samt:n2(v.samt),csamt:n2(v.csamt)}}));
    (b2b[pt.gstin]=b2b[pt.gstin]||{ctin:pt.gstin,inv:[]}).inv.push({
      inum:d.no,idt:dmy(d.date),val:d.totals.grand,pos:pt.state||db.company.state,rchrg:"N",inv_typ:"R",itms});
  });
  const b2csM={};
  inv.forEach(d=>{const pt=party(d.party)||{};if(pt.gstin)return;
    d.lines.forEach(l=>{const x=calcLine(l,d.totals.inter);const pos=pt.state||db.company.state,k=pos+"|"+num(l.gst);
      b2csM[k]=b2csM[k]||{sply_ty:d.totals.inter?"INTER":"INTRA",pos,typ:"OE",rt:num(l.gst),txval:0,iamt:0,camt:0,samt:0,csamt:0};
      const v=b2csM[k];v.txval+=x.taxable;v.iamt+=x.igst;v.camt+=x.cgst;v.samt+=x.sgst;v.csamt+=x.cess})});
  const hsnM={};
  inv.forEach(d=>d.lines.forEach(l=>{const x=calcLine(l,d.totals.inter);const it=item(l.item)||{};
    const k=(l.hsn||it.hsn||"")+"|"+num(l.gst);
    hsnM[k]=hsnM[k]||{hsn_sc:l.hsn||it.hsn||"",desc:l.name,uqc:l.unit,qty:0,rt:num(l.gst),txval:0,iamt:0,camt:0,samt:0,csamt:0};
    const v=hsnM[k];v.qty+=num(l.qty)+num(l.free);v.txval+=x.taxable;v.iamt+=x.igst;v.camt+=x.cgst;v.samt+=x.sgst;v.csamt+=x.cess}));
  const out={gstin:db.company.gstin||"",fp,version:"GST3.2.2",hash:"hash",
    b2b:Object.values(b2b),
    b2cs:Object.values(b2csM).map(v=>({...v,txval:n2(v.txval),iamt:n2(v.iamt),camt:n2(v.camt),samt:n2(v.samt),csamt:n2(v.csamt)})),
    hsn:{data:Object.values(hsnM).map((v,i)=>({num:i+1,...v,qty:n3(v.qty),txval:n2(v.txval),iamt:n2(v.iamt),camt:n2(v.camt),samt:n2(v.samt),csamt:n2(v.csamt)}))}};
  exportJson("gstr1-"+fp+".json",out);
  toast("GSTR-1 JSON exported — check it in the GST offline tool before filing");
}

function stockReport(tab){
  const q=stkF.q.toLowerCase();
  const items=db.items.filter(i=>!q||(i.name+" "+(i.company||"")+" "+(i.composition||"")).toLowerCase().includes(q));
  if(tab==="batch"){
    const rows=[];
    items.forEach(i=>batchStock(i.id).filter(b=>b.qty!==0).forEach(b=>{
      const e=b.exp?(b.exp.length===7?b.exp+"-28":b.exp):"";
      rows.push([esc(i.name),esc(i.company||""),esc(b.batch||"—"),
        b.exp?'<span class="'+(e<today()?"chip exp":e<addDays(today(),90)?"chip near":"chip")+'">'+my(b.exp)+'</span>':"—",
        {n:money(b.mrp)},{n:qty(b.qty)},esc(i.unit),{n:money(b.rate)},{n:money(b.qty*b.rate)}])}));
    return{title:"Batch-wise stock",head:["Item","Company","Batch","Expiry","MRP","Qty","Unit","Cost","Value"],rows,
      foot:'<div class="bd" style="text-align:right"><b>Total '+rup(rows.reduce((s,r)=>s+num(String(r[8].n).replace(/,/g,"")),0))+'</b></div>'};
  }
  if(tab==="expiry"){
    const ex=expiryBuckets();
    const rows=ex.expired.map(b=>[esc(b.item.name),esc(b.batch||"—"),'<span class="chip exp">'+my(b.exp)+'</span>',"Expired",
        {n:qty(b.qty)},{n:money(b.mrp)},{n:money(b.qty*(b.rate||costOf(b.item.id)))}])
      .concat(ex.near.map(b=>[esc(b.item.name),esc(b.batch||"—"),'<span class="chip near">'+my(b.exp)+'</span>',
        days(today(),b.exp.length===7?b.exp+"-28":b.exp)+" days left",{n:qty(b.qty)},{n:money(b.mrp)},{n:money(b.qty*(b.rate||costOf(b.item.id)))}]));
    return{title:"Expired and near-expiry batches",head:["Item","Batch","Expiry","Status","Qty","MRP","Value at cost"],rows,
      foot:'<div class="bd hint">Near expiry = within '+(db.settings.expiryWarnDays||90)+' days. Change it in Setup.</div>'};
  }
  if(tab==="move"){
    const rows=mv().filter(x=>inRange(x.date,stkF.from,stkF.to)&&(!q||((item(x.item)||{}).name||"").toLowerCase().includes(q)))
      .map(x=>[dmy(x.date),esc((item(x.item)||{}).name||"?"),esc(x.batch||"—"),esc(x.doc),
        {n:x.qty>0?qty(x.qty):""},{n:x.qty<0?qty(-x.qty):""},{n:money(x.rate)}]);
    return{title:"Stock movement",head:["Date","Item","Batch","Document","In","Out","Rate"],rows};
  }
  if(tab==="val"){
    const rows=items.map(i=>{const s=stockOf(i.id),c=costOf(i.id);
      return [esc(i.name),esc(i.company||""),esc(i.pack||""),{n:qty(s)},esc(i.unit),{n:money(c)},{n:money(s*c)},
        {n:money(i.mrp)},{n:money(s*num(i.mrp))}]}).filter(r=>num(String(r[3].n))!==0)
      .sort((a,b)=>num(String(b[6].n).replace(/,/g,""))-num(String(a[6].n).replace(/,/g,"")));
    const tc=n2(items.reduce((s,i)=>s+stockOf(i.id)*costOf(i.id),0)), tm=n2(items.reduce((s,i)=>s+stockOf(i.id)*num(i.mrp),0));
    return{title:"Stock valuation",head:["Item","Company","Pack","Qty","Unit","Cost","Value at cost","MRP","Value at MRP"],rows,
      foot:'<div class="bd" style="display:flex;gap:24px;justify-content:flex-end"><b>At cost '+rup(tc)+'</b><b>At MRP '+rup(tm)+'</b></div>'};
  }
  if(tab==="low"){
    const rows=items.filter(i=>num(i.reorder)&&stockOf(i.id)<=num(i.reorder))
      .map(i=>{const s=stockOf(i.id);
        return [esc(i.name),esc(i.company||""),{n:qty(s)},{n:qty(i.reorder)},{n:qty(Math.max(0,num(i.reorder)*2-s))},{n:money(costOf(i.id))},
          {n:money(Math.max(0,num(i.reorder)*2-s)*costOf(i.id))}]});
    return{title:"Reorder list",head:["Item","Company","Stock","Reorder level","Suggested order","Cost","Order value"],rows,
      foot:'<div class="bd" style="text-align:right"><b>Indent value '+rup(rows.reduce((s,r)=>s+num(String(r[6].n).replace(/,/g,"")),0))+'</b></div>'};
  }
  const sold={};
  db.invoices.forEach(d=>d.lines.forEach(l=>{sold[l.item]=Math.max(sold[l.item]||"",d.date)}));
  const rows=items.filter(i=>stockOf(i.id)>0&&(!sold[i.id]||sold[i.id]<addDays(today(),-90)))
    .map(i=>[esc(i.name),esc(i.company||""),{n:qty(stockOf(i.id))},sold[i.id]?dmy(sold[i.id]):"never",
      sold[i.id]?days(sold[i.id])+" days":"—",{n:money(stockOf(i.id)*costOf(i.id))}]);
  return{title:"Non-moving stock (no sale in 90 days)",head:["Item","Company","Stock","Last sold","Age","Value"],rows};
}

function analysisReport(tab,inv){
  const agg=(keyFn,labelFn)=>{
    const m={};
    inv.forEach(d=>d.lines.forEach(l=>{const k=keyFn(d,l);if(k==null)return;
      const x=calcLine(l,d.totals.inter);
      m[k]=m[k]||{label:labelFn(d,l),qty:0,taxable:0,tax:0,cost:0,bills:new Set()};
      const v=m[k];v.qty+=num(l.qty);v.taxable+=x.taxable;v.tax+=x.tax+x.cess;v.cost+=num(l.qty)*costOf(l.item);v.bills.add(d.id)}));
    return Object.values(m).sort((a,b)=>b.taxable-a.taxable);
  };
  if(tab==="item")return{title:"Item-wise sales",head:["Item","Qty","Bills","Taxable","Tax","Total","Cost","Margin","Margin %"],
    rows:agg((d,l)=>l.item||l.name,(d,l)=>l.name).map(v=>[esc(v.label),{n:qty(v.qty)},{n:v.bills.size},{n:money(v.taxable)},{n:money(v.tax)},
      {n:money(v.taxable+v.tax)},{n:money(v.cost)},{n:money(v.taxable-v.cost)},{n:(v.taxable?n2((v.taxable-v.cost)/v.taxable*100):0)+"%"}])};
  if(tab==="company")return{title:"Company-wise sales",head:["Company","Qty","Bills","Taxable","Tax","Total","Margin"],
    rows:agg((d,l)=>((item(l.item)||{}).company||"—"),(d,l)=>((item(l.item)||{}).company||"Unlinked"))

  if(tab==="salt")return{title:"Salt / composition-wise sales",head:["Composition","Qty","Taxable","Margin"],
    rows:agg((d,l)=>((item(l.item)||{}).composition||"—"),(d,l)=>((item(l.item)||{}).composition||"Not recorded"))
      .map(v=>[esc(v.label),{n:qty(v.qty)},{n:money(v.taxable)},{n:money(v.taxable-v.cost)}])};
  if(tab==="party"){
    const m={};
    inv.forEach(d=>{const k=d.party||"cash",pt=party(d.party);
      m[k]=m[k]||{name:pt?pt.name:"Cash",gstin:pt?pt.gstin:"",n:0,taxable:0,tax:0,grand:0,due:0};
      const v=m[k];v.n++;v.taxable+=d.totals.taxable;v.tax+=d.totals.tax;v.grand+=d.totals.grand;v.due+=docStatus(d).due});
    return{title:"Customer-wise sales",head:["Customer","GSTIN","Bills","Taxable","Tax","Total","Outstanding"],
      rows:Object.values(m).sort((a,b)=>b.grand-a.grand).map(v=>[esc(v.name),esc(v.gstin||"—"),{n:v.n},{n:money(v.taxable)},{n:money(v.tax)},{n:money(v.grand)},{n:money(v.due)}])};
  }
  if(tab==="day"||tab==="month"){
    const m={};
    inv.forEach(d=>{const k=tab==="day"?d.date:d.date.slice(0,7);
      m[k]=m[k]||{k,n:0,taxable:0,tax:0,grand:0,cost:0};
      const v=m[k];v.n++;v.taxable+=d.totals.taxable;v.tax+=d.totals.tax;v.grand+=d.totals.grand;
      d.lines.forEach(l=>v.cost+=num(l.qty)*costOf(l.item))});
    return{title:tab==="day"?"Day-wise sales":"Month-wise sales",head:[tab==="day"?"Date":"Month","Bills","Taxable","Tax","Total","Margin"],
      rows:Object.values(m).sort((a,b)=>a.k.localeCompare(b.k)).map(v=>[tab==="day"?dmy(v.k):v.k,{n:v.n},{n:money(v.taxable)},{n:money(v.tax)},{n:money(v.grand)},{n:money(v.taxable-v.cost)}])};
  }
  return{title:"Profit per bill",head:["Invoice","Date","Customer","Taxable","Cost","Margin","Margin %"],
    rows:inv.slice().sort((a,b)=>a.date.localeCompare(b.date)).map(d=>{
      let c=0;d.lines.forEach(l=>c+=num(l.qty)*costOf(l.item));
      const pt=party(d.party);
      return [esc(d.no),dmy(d.date),esc(pt?pt.name:""),{n:money(d.totals.taxable)},{n:money(c)},{n:money(d.totals.taxable-c)},
        {n:(d.totals.taxable?n2((d.totals.taxable-c)/d.totals.taxable*100):0)+"%"}]})};

function barcodeSvg(text,h,scale){
  text=String(text||"").replace(/[^\x20-\x7E]/g,"");if(!text)return"";
  h=h||30;scale=scale||1;
  const vals=[104];let sum=104;
  for(let i=0;i<text.length;i++){const v=text.charCodeAt(i)-32;vals.push(v);sum+=v*(i+1)}
  vals.push(sum%103);vals.push(106);
  let x=0,bars="";
  vals.forEach(v=>{const pat=C128[v];
    for(let i=0;i<pat.length;i++){const w=Number(pat[i])*scale;
      if(i%2===0)bars+='<rect x="'+n2(x)+'" y="0" width="'+n2(w)+'" height="'+h+'"/>';
      x+=w}});
  return '<svg class="bc" viewBox="0 0 '+n2(x)+' '+h+'" width="100%" height="'+h+'" preserveAspectRatio="none">'+bars+'</svg>';
}

const DEVDIG={"०":"0","१":"1","२":"2","३":"3","४":"4","५":"5","६":"6","७":"7","८":"8","९":"9"};

const FILLER=new Set(["ka","ke","ki","ko","of","x","into","aur","and","plus","please","de","do_","dena","dijiye","चाहिए","का","के","की"]);
function vNorm(s){
  s=String(s||"").toLowerCase().trim();
  s=s.replace(/[०-९]/g,c=>DEVDIG[c]||c);
  /* product names carry hyphens, dots and slashes: Pan-D, Liv.52, 30/70 */
  s=s.replace(/[-/.,!?;:"'`()+]/g," ").replace(/\s+/g," ").trim();
  return s;
}
function vTokens(s){return vNorm(s).split(" ").filter(Boolean)}
function numFrom(tokens){
  /* returns {value, used:[indices]} for the first number-ish run */
  let val=null,used=[];
  for(let i=0;i<tokens.length;i++){
    const t=tokens[i];
    if(/^\d+(\.\d+)?$/.test(t)){val=(val||0)+Number(t);used.push(i);
      if(tokens[i+1]==="hundred"||tokens[i+1]==="sau"){val*=100;used.push(i+1)}
      break}
    if(NUMW[t]!=null){
      let v=NUMW[t];used.push(i);
      const nx=tokens[i+1];
      if(nx&&(nx==="hundred"||nx==="sau"||nx==="सौ")){v*=100;used.push(i+1)}
      else if(nx&&NUMW[nx]!=null&&v>=20&&NUMW[nx]<10){v+=NUMW[nx];used.push(i+1)}
      val=v;break}
  }
  return val==null?null:{value:val,used};
}
function lev(a,b){
  if(a===b)return 0;const m=a.length,n=b.length;
  if(!m||!n)return Math.max(m,n);
  let prev=Array.from({length:n+1},(_,i)=>i);
  for(let i=1;i<=m;i++){const cur=[i];
    for(let j=1;j<=n;j++)cur[j]=Math.min(prev[j]+1,cur[j-1]+1,prev[j-1]+(a[i-1]===b[j-1]?0:1));
    prev=cur}
  return prev[n];
}
function tokSim(q,t){
  if(q===t)return 1;
  if(t.startsWith(q)||q.startsWith(t))return 0.85;
  const L=Math.max(q.length,t.length);
  if(L>=4){const d=lev(q,t);if(d<=1)return 0.75;if(d===2&&L>=6)return 0.55}
  return 0;
}

let _idx=null,_idxN=0;
function itemIndex(){
  if(_idx&&_idxN===db.items.length)return _idx;
  _idx=db.items.map(i=>({
    it:i,
    name:vTokens(i.name),
    extra:vTokens([i.composition,i.company,i.pack].filter(Boolean).join(" "))
  }));
  _idxN=db.items.length;return _idx;
}
function matchItems(query){
  const all=vTokens(query);
  const q=all.filter(t=>!UNITW[t]&&NUMW[t]==null&&!FILLER.has(t)&&(t.length>1||all.length>1));
  if(!q.length)return [];
  const out=[];
  itemIndex().forEach(e=>{
    let score=0,hit=0,numHit=0,numMiss=0;
    q.forEach(qt=>{
      let best=0;
      e.name.forEach(nt=>{const s=tokSim(qt,nt);if(s>best)best=s});
      let bestX=0;
      e.extra.forEach(nt=>{const s=tokSim(qt,nt);if(s>bestX)bestX=s});
      const isNum=/^\d+$/.test(qt);
      if(qt.length===1&&!isNum){score+=best*0.8;if(best>0)hit++;return}
      if(isNum){
        if(best>=0.99){numHit++;hit++;score+=2.2}
        else if(e.name.some(nt=>/^\d+$/.test(nt))){numMiss++;score-=0.8}
      } else {
        if(best>0){score+=best*1.6;hit++}
        else if(bestX>0){score+=bestX*0.5;hit++}
      }
    });
    /* prefer shorter names that are fully covered */
    const cover=hit/q.length;
    score+=cover*1.2;
    score-=Math.max(0,e.name.length-q.length)*0.06;
    /* the query IS the product name, word for word — that beats any fuzz */
    const qs=q.slice().sort().join(" "), ns=e.name.slice().sort().join(" ");
    if(qs===ns)score+=2.2;
    if(score>1.4)out.push({item:e.it,score:n2(score),cover:n2(cover),numHit,numMiss,
      stock:stockOf(e.it.id)});
  });
  out.sort((a,b)=>b.score-a.score||b.stock-a.stock);
  return out.slice(0,6);
}

function parseUtterance(raw){
  const text=vNorm(raw);
  if(!text)return{kind:"empty"};
  for(const c of CMDS)
    for(const w of c.w)
      if(text===w||text.startsWith(w+" ")||text.endsWith(" "+w)||text===vNorm(w))return{kind:"cmd",cmd:c.k,text};
  /* customer <name> */
  const cm=text.match(/^(?:customer|party|grahak|ग्राहक|कस्टमर|naam|name)\s+(.+)$/);
  if(cm)return{kind:"customer",name:cm[1],text};
  /* discount N percent */
  const dm=text.match(/(?:discount|chhut|छूट)\s*(\d+(?:\.\d+)?)/);
  if(dm)return{kind:"discount",value:Number(dm[1]),text};
  /* item line: separate quantity from the numbers that live inside product
     names (Dolo 650, Pan 40). A number sitting next to a unit word — allowing
     one filler word between — is the quantity; anything else stays in the name. */
  const toks=vTokens(text);
  const isNumTok=i=>i>=0&&i<toks.length&&(/^\d+(\.\d+)?$/.test(toks[i])||NUMW[toks[i]]!=null);
  const isUnitTok=i=>i>=0&&i<toks.length&&!!UNITW[toks[i]];
  let qtyIdx=-1,unit=null,unitIdx=-1;
  for(let i=0;i<toks.length;i++){
    if(!isNumTok(i))continue;
    for(const step of [1,2]){
      if(isUnitTok(i+step)&&(step===1||FILLER.has(toks[i+1]))){qtyIdx=i;unitIdx=i+step;break}
      if(isUnitTok(i-step)&&(step===1||FILLER.has(toks[i-1]))){qtyIdx=i;unitIdx=i-step;break}
    }
    if(qtyIdx>=0)break;
  }
  if(unitIdx>=0)unit=UNITW[toks[unitIdx]];
  if(!unit)toks.forEach(t=>{if(!unit&&UNITW[t])unit=UNITW[t]});
  let qty=null;
  if(qtyIdx>=0){const t=toks[qtyIdx];qty=/^\d/.test(t)?Number(t):NUMW[t];
    if(NUMW[toks[qtyIdx+1]]!=null&&(toks[qtyIdx+1]==="sau"||toks[qtyIdx+1]==="hundred"))qty*=100}
  /* words that are definitely not part of the name */
  const nameQuery=toks.filter((t,i)=>i!==qtyIdx&&i!==unitIdx&&!FILLER.has(t)).join(" ");
  const best=matchItems(nameQuery||text);
  if(!best.length||best[0].score<2.2)return{kind:"nomatch",text,candidates:best.filter(c=>c.score>1.8)};
  if(qty==null){const n=numFrom(toks.filter((t,i)=>{
      /* a leftover number not used by the matched name */
      const nameToks=new Set(vTokens(best[0].item.name));return !nameToks.has(t)}));
    if(n)qty=n.value}
  const top=best[0], second=best[1];
  const strong=top.cover>=0.99&&top.score>=2.5&&(!second||top.score-second.score>=0.7);
  return{kind:"item",candidates:best,qty,unit,strong,text};
}

        const r=await P.start({language:this.lang,maxResults:3,partialResults:true,popup:false});
        st(false);
        const m=(r&&r.matches)||[];
        if(m.length&&this.onText)this.onText(m[0],m);
      }catch(e){st(false);toast("Could not hear that — try again")}
      return;
    }
    if(this.engine==="web"){
      const R=window.SpeechRecognition||window.webkitSpeechRecognition;
      const rec=new R();this._rec=rec;
      rec.lang=this.lang;rec.interimResults=true;rec.maxAlternatives=3;rec.continuous=false;
      rec.onresult=e=>{
        let fin="",part="";const alts=[];
        for(let i=e.resultIndex;i<e.results.length;i++){
          const r=e.results[i];
          if(r.isFinal){fin+=r[0].transcript;for(let j=0;j<r.length;j++)alts.push(r[j].transcript)}
          else part+=r[0].transcript;
        }
        if(part&&this.onPartial)this.onPartial(part);
        if(fin&&this.onText)this.onText(fin.trim(),alts);
      };
      rec.onerror=ev=>{st(false);
        if(ev.error==="not-allowed")toast("Microphone blocked — allow it in the browser");
        else if(ev.error==="no-speech")toast("Didn't catch that");
        else if(ev.error==="network")toast("Speech needs internet in the browser — the APK works offline");
      };
      rec.onend=()=>st(false);
      st(true);try{rec.start()}catch(e){st(false)}
      return;
    }
    toast("No speech engine here — type the line instead");
  },
  stop(){
    try{
      if(this.engine==="native")window.Capacitor.Plugins.SpeechRecognition.stop();
      else if(this._rec)this._rec.stop();
    }catch(e){}
    this.listening=false;if(this.onState)this.onState(false);
  },
  say(text){
    if(!db.settings.voiceSpeak)return;
    try{
      if(!window.speechSynthesis)return;
      const u=new SpeechSynthesisUtterance(text);
      u.lang=this.lang;u.rate=1.02;
      speechSynthesis.cancel();speechSynthesis.speak(u);
    }catch(e){}
  }
};

  function addItem(it,q,unit){
    const bs=batchStock(it.id).filter(b=>b.qty>0);

    const pt=party(vst.party);

    const l={item:it.id,name:it.name,hsn:it.hsn||"",batch:b.batch||"",exp:b.exp||"",mrp:num(b.mrp)||num(it.mrp),
      unit:unit||it.unit||"PCS",qty:q||1,free:0,rate:num(it[f])||num(it.rate),disc:0,gst:num(it.gst),cess:num(it.cess)};
    const ex=vst.lines.find(x=>x.item===l.item&&x.batch===l.batch);
    if(ex)ex.qty=num(ex.qty)+num(l.qty);else vst.lines.push(l);

  function handle(text,alts){
    const r=parseUtterance(text);
    vst.log.push({text,kind:r.kind});
    if(r.kind==="cmd"){
      if(r.cmd==="new"){vReset();Voice.say("New bill started");render();return}
      if(r.cmd==="undo"){vst.lines.pop();Voice.say("Removed");render();return}
      if(r.cmd==="clear"){vReset();Voice.say("Bill cleared");render();return}
      if(r.cmd==="total"){const T=vTotals();Voice.say("Total "+Math.round(T.grand)+" rupees");toast("Total "+rup(T.grand));return}
      if(r.cmd==="cash"){vst.mode="Cash";Voice.say("Cash bill");render();return}
      if(r.cmd==="credit"){vst.mode="Credit";Voice.say("Credit bill");render();return}
      if(r.cmd==="save"){review({});return}
      if(r.cmd==="print"){review({print:true});return}
      if(r.cmd==="repeat"){const l=vst.lines[vst.lines.length-1];
        if(l)Voice.say(l.name+", "+qty(l.qty)+", "+money(vLineTotal(l)));return}
    }
    if(r.kind==="customer"){
      const m=matchParty(r.name);
      if(m){vst.party=m.id;vst.partyName=m.name;Voice.say("Customer "+m.name);render()}
      else{vst.partyName=r.name.replace(/\b\w/g,c=>c.toUpperCase());vst.party="";Voice.say("New customer "+vst.partyName);render()}
      return;
    }
    if(r.kind==="discount"){
      const l=vst.lines[vst.lines.length-1];
      if(l){l.disc=r.value;Voice.say(r.value+" percent discount on "+l.name);render()}
      return;
    }
    if(r.kind==="item"){
      if(r.strong&&db.settings.voiceAutoAdd!==false)addItem(r.candidates[0].item,r.qty,r.unit);
      else{vst.pending={candidates:r.candidates,qty:r.qty,unit:r.unit,text};
        Voice.say("Which one?");render()}
      return;
    }
    /* nothing matched — try the alternative transcripts the engine offered */
    if(alts&&alts.length>1){
      for(const a of alts.slice(1)){
        const r2=parseUtterance(a);
        if(r2.kind==="item"&&r2.strong){addItem(r2.candidates[0].item,r2.qty,r2.unit);return}
      }
    }
    if(r.candidates&&r.candidates.length){
      vst.pending={candidates:r.candidates,qty:r.qty,unit:r.unit,text};Voice.say("Did you mean");render();return;
    }
    Voice.say("Not found");toast('No medicine matched “'+text+'”');render();
  }
  function matchParty(name){
    const q=vNorm(name);
    let best=null,bs=0;
    db.parties.filter(x=>x.type!=="supplier").forEach(x=>{
      const t=vNorm(x.name);let s=0;
      if(t===q)s=3;else if(t.startsWith(q)||q.startsWith(t))s=2.2;
      else{const qt=q.split(" "),tt=t.split(" ");
        qt.forEach(a=>tt.forEach(b=>{const v=tokSim(a,b);if(v>0.7)s+=v}))}
      if(s>bs){bs=s;best=x}});
    return bs>=1.4?best:null;
  }
  function review(opt){
    opt=opt||{};
    if(!vst.lines.length)return toast("Nothing on the bill yet");
    const kind=db.settings.fieldKind||"order";
    const T=vTotals();
    const rx=vst.lines.filter(l=>(item(l.item)||{}).rx);

      '<div class="row" style="gap:18px;margin-bottom:10px"><div><div class="l f">Document</div><b>'+FKIND[kind].title+'</b></div>'+
      '<div><div class="l f">Number</div><b>'+esc(kind==="order"?ordNo():fieldNo())+'</b></div>'+
      '<div><div class="l f">Customer</div><b>'+esc(vst.partyName||"Counter sale")+'</b></div>'+
      '<div><div class="l f">Type</div><b>'+esc(vst.mode)+'</b></div>'+
      '<div><div class="l f">Items</div><b>'+vst.lines.length+'</b></div></div>'+
      tbl(["Item","Batch","Qty","Rate","Amount"],vst.lines.map(l=>[esc(l.name),esc(l.batch||"—"),
        {n:qty(l.qty)+" "+esc(l.unit)},{n:money(l.rate)},{n:money(vLineTotal(l))}]))+
      '<div class="sep"></div>'+
      '<div style="display:flex;justify-content:space-between;align-items:baseline">'+
        '<span>Total payable</span><span style="font-size:30px;font-weight:700">'+rup(T.grand)+'</span></div>'+
      '<div class="hint">'+esc(words(T.grand))+'</div>'+
      (rx.length?'<div class="warnbar" style="margin-top:10px">'+rx.length+' prescription item'+(rx.length>1?"s":"")+' — keep the doctor\'s prescription on file.</div>':'')+
      (short.length?'<div class="warnbar" style="margin-top:8px">Short of stock: '+esc(short.map(l=>l.name).join(", "))+'. The bill will still save and stock will go negative.</div>':'')+
      '</div>',
      [["Back","close"],
       [opt.print?"Save & print":opt.share?"Save & send":"Save "+(kind==="order"?"order":"bill"),
        ()=>{const rec=commitField(vst,kind,!!opt.print,!!opt.share);
             if(rec){vReset();render()}},"pri"]],true);
    Voice.say("Total "+Math.round(T.grand)+" rupees. Save?");
  }
};

    due:st.mode==="Cash"?"":addDays(today(),num((party(st.party)||{}).credit)),
    lines:st.lines.map(l=>({...l,qty:num(l.qty)})),charges:[],billDisc:"",

function billImage(d){
  const c=db.company,t=d.totals||calcDoc(d),pt=party(d.party)||{};
  const kind=d.kind||"invoice";
  const W=760,P=28;
  const cv=document.createElement("canvas");
  const ctx=cv.getContext("2d");
  const F=(sz,wt)=>(wt||"400")+" "+sz+'px -apple-system,"Segoe UI",Roboto,Arial,sans-serif';
  const MONO=sz=>'400 '+sz+'px ui-monospace,Menlo,Consolas,monospace';
  /* measure first, then draw at the right height */
  const head=[];
  head.push([c.name,22,"700"]);
  if(c.prop)head.push(["Prop.: "+c.prop,14]);
  const addr=[c.addr,c.city,c.pin].filter(Boolean).join(", ");
  if(addr)head.push([addr,14]);
  if(c.phone)head.push(["Ph: "+c.phone,14]);
  if(c.gstin)head.push(["GSTIN: "+c.gstin,14,"600"]);
  const dls=[c.dl,c.dl2].filter(Boolean);
  if(dls.length)head.push(["D.L. No: "+dls.join(", "),13]);
  const rows=d.lines.length;
  const H=P+head.length*22+40+70+34+rows*40+30+150+(kind==="order"?46:26)+40;
  cv.width=W;cv.height=H;
  ctx.fillStyle="#fff";ctx.fillRect(0,0,W,H);
  ctx.fillStyle="#111";ctx.textBaseline="top";
  let y=P;
  head.forEach(([txt,sz,wt])=>{ctx.font=F(sz,wt);ctx.textAlign="center";ctx.fillText(txt,W/2,y);y+=sz+6});
  y+=6;
  ctx.fillStyle="#111";ctx.fillRect(P,y,W-2*P,2);y+=12;
  ctx.font=F(17,"700");ctx.textAlign="center";
  ctx.fillText(FKIND[kind].title,W/2,y);y+=28;
  ctx.font=F(14);ctx.textAlign="left";
  ctx.fillText("No: "+d.no,P,y);
  ctx.textAlign="right";ctx.fillText("Date: "+dmy(d.date),W-P,y);y+=22;
  ctx.textAlign="left";ctx.font=F(15,"700");
  ctx.fillText("To: "+(pt.name||""),P,y);y+=20;
  ctx.font=F(13);ctx.fillStyle="#555";
  ctx.fillText([pt.city,pt.gstin?"GSTIN "+pt.gstin:"",pt.phone].filter(Boolean).join("  ·  "),P,y);y+=24;
  ctx.fillStyle="#111";
  /* table header */
  ctx.fillStyle="#eef1f5";ctx.fillRect(P,y,W-2*P,26);ctx.fillStyle="#333";
  ctx.font=F(12,"700");
  ctx.fillText("ITEM",P+8,y+7);
  ctx.textAlign="right";
  ctx.fillText("QTY",P+430,y+7);ctx.fillText("RATE",P+540,y+7);ctx.fillText("AMOUNT",W-P-8,y+7);
  y+=30;ctx.fillStyle="#111";
  d.lines.forEach((l,i)=>{
    const x=calcLine(l,t.inter);
    ctx.textAlign="left";ctx.font=F(14,"600");
    let nm=l.name;
    while(ctx.measureText(nm).width>330&&nm.length>6)nm=nm.slice(0,-2);
    if(nm!==l.name)nm+="…";
    ctx.fillText(nm,P+8,y);
    ctx.font=F(11);ctx.fillStyle="#666";
    ctx.fillText([l.batch?"B: "+l.batch:"",l.exp?"Exp "+my(l.exp):"",num(l.mrp)?"MRP "+money(l.mrp):"",
      num(l.disc)?"less "+num(l.disc)+"%":"",num(l.free)?qty(l.free)+" free":""].filter(Boolean).join("  ·  "),P+8,y+17);
    ctx.fillStyle="#111";ctx.textAlign="right";ctx.font=MONO(14);
    ctx.fillText(qty(l.qty)+(num(l.free)?"+"+qty(l.free):"")+" "+l.unit,P+430,y+2);
    ctx.fillText(money(l.rate),P+540,y+2);
    ctx.font=MONO(14);ctx.fillText(money(x.total),W-P-8,y+2);
    y+=40;
    ctx.strokeStyle="#eceff3";ctx.beginPath();ctx.moveTo(P,y-7);ctx.lineTo(W-P,y-7);ctx.stroke();
  });
  y+=6;
  const put=(k,v,bold,sz)=>{ctx.textAlign="right";ctx.font=F(sz||14,bold?"700":"400");
    ctx.fillText(k,W-P-150,y);ctx.font=MONO(sz||14);if(bold)ctx.font="700 "+(sz||14)+"px ui-monospace,Menlo,Consolas,monospace";
    ctx.fillText(v,W-P-8,y);y+=(sz||14)+9};
  put("Taxable",money(t.taxable));
  if(t.inter)put("IGST",money(t.igst));
  else{put("CGST",money(t.cgst));put("SGST",money(t.sgst))}
  if(t.round)put("Round off",money(t.round));
  y+=4;ctx.fillStyle="#111";ctx.fillRect(W-P-260,y,260,2);y+=10;
  put("TOTAL","Rs "+money(t.grand),true,20);
  y+=4;ctx.textAlign="left";ctx.font=F(12);ctx.fillStyle="#555";
  ctx.fillText(words(t.grand),P,y);y+=24;
  if(kind==="order"){
    ctx.fillStyle="#b4541a";ctx.font=F(13,"700");
    ctx.fillText("NOT A TAX INVOICE — tax invoice will follow with the goods.",P,y);y+=22;
  }
  ctx.fillStyle="#777";ctx.font=F(11);
  ctx.fillText((c.upi?"UPI: "+c.upi+"   ·   ":"")+"Thank you",P,y);
  return cv;
}
function billText(d){

    L.push(l.name+(l.batch?" ["+l.batch+"]":""));
    L.push("   "+qty(l.qty)+(num(l.free)?"+"+qty(l.free)+"F":"")+" "+l.unit+" x "+money(l.rate)+
      (num(l.disc)?" less "+num(l.disc)+"%":"")+"  =  "+money(x.total))});
  L.push("");
  L.push("Taxable: "+money(t.taxable));
  if(t.inter)L.push("IGST: "+money(t.igst));
  else{L.push("CGST: "+money(t.cgst));L.push("SGST: "+money(t.sgst))}
  if(t.round)L.push("Round off: "+money(t.round));

async function shareDoc(d,how){
  const text=billText(d);
  const pt=party(d.party)||{};
  if(how==="text"){
    const phone=String(pt.phone||"").replace(/\D/g,"").replace(/^(\d{10})$/,"91$1");
    const url="https://wa.me/"+phone+"?text="+encodeURIComponent(text);
    try{window.open(url,"_blank")}catch(e){}
    return;
  }
  const cv=billImage(d);
  const name=(d.no||"bill").replace(/\W+/g,"-")+".png";
  /* 1. the APK: write to cache, then the Android share sheet */
  try{
    const P=window.Capacitor&&window.Capacitor.Plugins;
    if(P&&P.Filesystem&&P.Share){
      const b64=cv.toDataURL("image/png").split(",")[1];
      const w=await P.Filesystem.writeFile({path:name,data:b64,directory:"CACHE"});
      const uri=(await P.Filesystem.getUri({path:name,directory:"CACHE"})).uri||w.uri;
      await P.Share.share({title:d.no,text,url:uri,dialogTitle:"Send the bill"});
      return;
    }
  }catch(e){ toast("Share failed — saving the picture instead") }
  /* 2. a browser that can share files */
  try{
    const blob=await new Promise(r=>cv.toBlob(r,"image/png"));
    const file=new File([blob],name,{type:"image/png"});
    if(navigator.canShare&&navigator.canShare({files:[file]})){
      await navigator.share({files:[file],text,title:d.no});return;
    }
    /* 3. download the picture and open WhatsApp with the text */
    const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=name;
    document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),5000);
    toast("Picture saved — attach it in WhatsApp");
    const phone=String(pt.phone||"").replace(/\D/g,"").replace(/^(\d{10})$/,"91$1");
    window.open("https://wa.me/"+phone+"?text="+encodeURIComponent(text),"_blank");
  }catch(e){toast("Could not build the picture here")}
}
