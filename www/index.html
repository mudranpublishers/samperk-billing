     '<button class="btn" id="mg-all" style="flex:1">Everything CSV</button>'+
   '</div>'+
   '<div class="sep"></div>'+
   '<b>Setting it up in Marg — once, then it is one click every day</b>'+
   '<ol style="font-size:13px;padding-left:18px;line-height:1.6">'+
     '<li>Copy the CSV to the PC (WhatsApp it to yourself, or a pen drive).</li>'+
     '<li>In Marg: <b>Masters → Marg Setups → Advance Features → ERP Bridger-Import-Inventory → Method</b>.</li>'+
     '<li>Name the method (say “Samperk Phone”). Set <b>Not found want to create = Yes</b>, '+
       '<b>Default Type = Sale Order</b> (or <b>Sale</b> if you want bills straight away), and '+
       '<b>Data from line = 2</b>, because row 1 holds the column names.</li>'+
     '<li>Map the columns to Marg’s fields. The file always has the same columns in the same order:<br>'+
       '<span class="hint">'+MARG_COLS.map((c,i)=>(i+1)+". "+c).join(" · ")+'</span></li>'+
     '<li>From then on: <b>Transactions → ERP Bridger → Import-Inventory</b>, pick the method, pick the file.</li>'+
   '</ol>'+
   '<div class="warnbar">Import an order into Marg <b>or</b> bill it here — not both, or the sale counts twice.</div>',
   [["Close","close"]],true);
  const upd=()=>{
    const a=$("#mg-from").value,b=$("#mg-to").value;
    const o=(db.orders||[]).filter(d=>inRange(d.date,a,b));
    const i=db.invoices.filter(d=>d.source==="field"&&inRange(d.date,a,b));
    $("#mg-count").innerHTML="<b>"+o.length+"</b> orders ("+rup(o.reduce((s,d)=>s+(d.totals||calcDoc(d)).grand,0))+
      ") and <b>"+i.length+"</b> field tax invoices ("+rup(i.reduce((s,d)=>s+(d.totals||calcDoc(d)).grand,0))+") in this range.";
    return{o,i,a,b};
  };
  upd();
  $("#mg-from").onchange=upd;$("#mg-to").onchange=upd;
  $("#mg-ord").onclick=()=>{const{o,a}=upd();if(!o.length)return toast("No orders in that range");
    exportCsv("marg-sale-orders-"+a+".csv",margRows(o));return false};
  $("#mg-inv").onclick=()=>{const{i,a}=upd();if(!i.length)return toast("No field invoices in that range");
    exportCsv("marg-sale-bills-"+a+".csv",margRows(i));return false};
  $("#mg-all").onclick=()=>{const{o,i,a}=upd();const all=o.concat(i);
    if(!all.length)return toast("Nothing in that range");
    exportCsv("marg-all-"+a+".csv",margRows(all));return false};
}
/* =================================================================
   catalogue loader, sample data, boot
   ================================================================= */
function loadCatalogue(){
  let added=0,upd=0;
  SEED.forEach((r,ix)=>{
    const [name,composition,company,form,type,pack,mrp,rx,unit,hsn,gst]=r;
    const rate=n2(mrp/(1+gst/100)/1.2), cost=n2(rate/1.1), wrate=n2(rate*0.97);
    let it=db.items.find(x=>x.name.toLowerCase()===name.toLowerCase());
    const o={name,composition,company,form,type,pack,unit,hsn,gst:num(gst),cess:0,
      mrp:n2(mrp),rate,wrate,cost,rx:!!rx,code:"SAM"+String(ix+1).padStart(4,"0"),rack:"",reorder:0};
    if(it){Object.assign(it,o);upd++}else{o.id=uid("it");db.items.push(o);added++}
  });
  touch();return{added,upd};
}
function sampleTransactions(){
  if(!db.items.length)loadCatalogue();
  const mkP=(name,type,gstin,state,city,phone,dl,credit)=>{
    let p=db.parties.find(x=>x.name===name);
    if(!p){p={id:uid("p"),name,type,gstin,state,city,phone,dl,credit,limit:0,addr:"",pin:"",email:"",opening:0,openingType:"dr",rateType:"rate"};db.parties.push(p)}
    return p};
  const st=db.company.state||"27";
  const sup1=mkP("Medilink Pharma Stockist","supplier","",st,"","","",30);
  const sup2=mkP("Vardhman Distributors","supplier","",st,"","","",21);
  const c1=mkP("Sai Medical Stores","customer","",st,"","9820000011","MH-21B-1234",15);
  const c2=mkP("Jeevan Chemist","customer","",st,"","9820000022","MH-21B-5678",21);
  const c3=mkP("Apollo Pharmacy — Branch","customer","",st,"","9820000033","",30);
  const c4=mkP("Counter Sale","customer","",st,"","","",0);
  const d=new Date(), dt=k=>new Date(d.getTime()-k*864e5).toISOString().slice(0,10);
  const expM=k=>{const x=new Date(d.getFullYear(),d.getMonth()+k,1);return x.getFullYear()+"-"+String(x.getMonth()+1).padStart(2,"0")};
  /* purchases bring in stock with batches */
  const pick=(n,seedN)=>{const out=[];for(let i=0;i<n;i++)out.push(db.items[(seedN*37+i*53)%db.items.length]);return out};
  [[sup1,34,0],[sup2,27,1],[sup1,16,2],[sup2,6,3]].forEach(([sup,back,k])=>{
    const its=pick(14,k+1);
    const p={id:uid("d"),type:"purchase",no:docNo("purchase"),date:dt(back),party:sup.id,partyName:sup.name,mode:"Credit",
      refNo:"B-"+(2300+k*17),refDate:dt(back),against:"",vehicle:"",eway:"",lr:"",due:addDays(dt(back),sup.credit),
      lines:its.map((it,i)=>({item:it.id,name:it.name,hsn:it.hsn,batch:"B"+(k+1)+String(i+1).padStart(2,"0")+String(d.getFullYear()).slice(2),
        exp:expM(6+((i*5+k)%24)),mrp:it.mrp,unit:it.unit,qty:[10,20,25,30,50][(i+k)%5],free:(i%7===0?1:0),
        rate:it.cost,disc:0,gst:it.gst,cess:0})),charges:[],billDisc:"",notes:""};
    calcDoc(p);db.purchases.push(p);db.settings.purNext++;
  });
  /* sales */
  const custs=[c1,c2,c3,c4,c1,c2,c3,c1];
  [30,24,19,15,11,7,4,1,0].forEach((back,k)=>{
    const cu=custs[k%custs.length];
    const avail=db.items.filter(i=>stockOf(i.id)>3);
    if(!avail.length)return;
    const its=[];for(let i=0;i<4+(k%3);i++)its.push(avail[(k*29+i*41)%avail.length]);
    const inv={id:uid("d"),type:"sale",no:docNo("sale"),date:dt(back),party:cu.id,partyName:cu.name,
      mode:cu.name==="Counter Sale"?"Cash":"Credit",refNo:"",refDate:"",against:"",vehicle:"",eway:"",lr:"",
      due:addDays(dt(back),cu.credit),lines:[],charges:[],billDisc:"",notes:""};
    const seen={};
    its.forEach((it,i)=>{if(seen[it.id])return;seen[it.id]=1;
      const b=batchStock(it.id).filter(x=>x.qty>0)[0];if(!b)return;
      inv.lines.push({item:it.id,name:it.name,hsn:it.hsn,batch:b.batch,exp:b.exp,mrp:it.mrp,unit:it.unit,
        qty:Math.max(1,Math.min(Math.floor(b.qty/2),[2,3,5,10][(i+k)%4])),free:0,rate:it.rate,disc:(i%4===0?5:0),gst:it.gst,cess:0})});
    if(!inv.lines.length)return;
    calcDoc(inv);db.invoices.push(inv);db.settings.next++;
    if(k%3!==0&&inv.mode!=="Cash"){
      db.vouchers.push({id:uid("v"),type:"receipt",no:vchNo(),date:dt(Math.max(0,back-3)),party:cu.id,against:inv.id,
        mode:k%2?"UPI":"Cash",ref:"",amount:k%4===1?n2(inv.totals.grand/2):inv.totals.grand,
        entries:[{ledger:k%2?"bank":"cash",dr:k%4===1?n2(inv.totals.grand/2):inv.totals.grand,cr:0},
                 {ledger:"p:"+cu.id,dr:0,cr:k%4===1?n2(inv.totals.grand/2):inv.totals.grand}],narration:"Against bill "+inv.no});
      db.settings.vchNext++;
    }
  });
  /* a credit note and an expense */
  const src=db.invoices[2];
  if(src){const cn={id:uid("d"),type:"cr",no:docNo("cr"),date:dt(9),party:src.party,partyName:"",mode:"Credit",
    against:src.no,refNo:"",refDate:"",vehicle:"",eway:"",lr:"",due:"",
    lines:[Object.assign({},src.lines[0],{qty:1})],charges:[],billDisc:"",notes:"Damaged in transit"};
    calcDoc(cn);db.crnotes.push(cn);db.settings.crNext++}
  ["Shop rent","Electricity","Transport & freight","Staff salary"].forEach((n,i)=>{
    let l=db.ledgers.find(x=>x.name===n);
    if(!l){l={id:uid("lg"),name:n,group:"Indirect Expenses",opening:0,openingType:"dr"};db.ledgers.push(l)}
    db.vouchers.push({id:uid("v"),type:"expense",no:vchNo(),date:dt(12-i*2),party:"",amount:[18000,3400,2600,24000][i],
      entries:[{ledger:l.id,dr:[18000,3400,2600,24000][i],cr:0},{ledger:i%2?"bank":"cash",dr:0,cr:[18000,3400,2600,24000][i]}],
      narration:n,mode:"",ref:""});db.settings.vchNext++});
  db.ledgers.find(l=>l.id==="capital").opening=200000;
  db.ledgers.find(l=>l.id==="capital").openingType="cr";
  db.ledgers.find(l=>l.id==="cash").opening=25000;
  db.ledgers.find(l=>l.id==="bank").opening=175000;
  touch();
}
/* Samperk's own registration details. Only the facts given — address,
   phone, drug licence and FSSAI are left blank for Paritosh to fill in,
   because an invoice carrying a made-up licence number is worse than one
   carrying none. */
function applySamperk(c){
  c.name="Samperk Pharmaceuticals Distributors";
  c.prop="Paritosh Kumar";
  c.gstin="05AJOPK1635L1Z0";
  c.pan="AJOPK1635L";          /* the PAN embedded in the GSTIN */
  c.state="05";                /* Uttarakhand */
  c.addr=c.addr||"98/1, Nalapani Road";
  c.city=c.city||"Dehradun";
  c.pin=c.pin||"248001";
  /* phone, email, drug licence, FSSAI and bank details are left for
     Paritosh to enter — the numbers on the Marg screen belong to the
     Marg dealer, not to the shop. */
  c.terms="Goods once sold will not be taken back without prior approval. "+
    "Interest @18% p.a. on bills not paid within the credit period. "+
    "Subject to Dehradun jurisdiction.";
  c.decl="We declare that this invoice shows the actual price of the goods described "+
    "and that all particulars are true and correct.";
  return c;
}
/* ---------- boot ---------- */
function boot(){_stamp++;recalcAll();setPage(db.settings.printFormat||"A4");drawNav();render();
  Voice.lang=db.settings.voiceLang||"en-IN";
  Voice.detect().then(e=>{if(view==="voice")render()});
}
window.addEventListener("beforeunload",e=>{if(dirty){e.preventDefault();e.returnValue=""}});
$("#btnsave").onclick=()=>saveFile(false);
$("#btnopen").onclick=openFile;
$("#burger").onclick=()=>$("#side").classList.toggle("open");
$("#filepick").onchange=e=>{
  const f=e.target.files[0];if(!f)return;const r=new FileReader();
  r.onload=()=>{try{const d=JSON.parse(r.result);if(!hydrate(d))return toast("Not a Billing Desk file");
    dirty=false;$("#dirty").textContent="";backup();boot();toast("Opened "+f.name)}catch(x){toast("Could not read that file")}};
  r.readAsText(f);e.target.value="";
};
if(window.matchMedia("(max-width:860px)").matches)$("#burger").style.display="block";
/* register the offline service worker when served over http(s) */
if("serviceWorker" in navigator&&location.protocol.startsWith("http")){
  window.addEventListener("load",()=>navigator.serviceWorker.register("pwa/sw.js").catch(()=>{}));
}
(function start(){
  const b=loadBackup();
  if(b&&hydrate(b)&&(db.items.length||db.invoices.length)){
    /* one-time: an install that predates the registration details */
    if(/samperk/i.test(db.company.name||"")&&(!db.company.gstin||!db.company.addr)){applySamperk(db.company);mark()}
    boot();dirty=true;$("#dirty").textContent="restored from this device";return;
  }
  db=blank();
  applySamperk(db.company);
  loadCatalogue();dirty=false;boot();
  setTimeout(()=>modal("Welcome — Samperk Pharmaceuticals Distributors",
    '<p style="margin-top:0">Your <b>'+SEED.length+'-product catalogue</b> is already loaded with pack sizes, HSN codes, GST rates, MRP and Rx flags. '+
    'Sale rate (PTR) and purchase cost (PTS) are calculated from MRP on the usual 20% / 10% trade margins — edit any of them in <b>Items &amp; stock</b>.</p>'+
    '<ul style="margin:10px 0 0;padding-left:18px;font-size:13.5px">'+
    '<li>GSTIN <b>05AJOPK1635L1Z0</b> (Uttarakhand) and proprietor <b>Paritosh Kumar</b> are already set. '+
    'Add the <b>shop address, phone, drug licence 20B/21B and bank details</b> in Setup — they print on every bill.</li>'+
    '<li>Stock starts at zero. Enter a <b>Purchase bill</b> (with batch and expiry) and stock builds itself.</li>'+
    '<li>CGST+SGST or IGST is decided automatically from the customer\'s state.</li>'+
    '<li>Your data lives in <b>one file you keep</b> — press <b>Ctrl+S</b> or tap Save often.</li></ul>',
    [["Add sample bills to explore",()=>{sampleTransactions();boot();toast("Sample transactions added")}],
     ["Open Setup",()=>go("settings")],
     ["Start billing","close","pri"]]),300);
})();
